          if (b.getAttribute('data-id') === o.ans) {
            locked = true; b.classList.add('ok'); Audio.play('correct'); say(root, 'درست! ' + o.why, 'ok');
            timers.push(setTimeout(function () { i++; locked = false; if (i >= 3) { say(root, 'همهٔ مانع‌ها را کنار زدی! 🎉', 'ok'); ctx.onSolved(); } else render(); }, 1800));
          } else { b.classList.add('no'); Audio.play('wrong'); ctx.onFail(); say(root, 'این ابزار برای این مانع مناسب نیست. دوباره فکر کن.', 'bad'); }
        });
      });
    }
    render();
    return { destroy: function () { timers.forEach(clearTimeout); } };
  };

  /* ═══════════ ۶) چالش تشخیص تبدیل انرژی ═══════════ */
  var DEV = [
    { e: '💡', n: 'لامپ', inp: 'الکتریکی', out: 'نورانی' },
    { e: '🌀', n: 'پنکه', inp: 'الکتریکی', out: 'جنبشی' },
    { e: '🔊', n: 'بلندگو', inp: 'الکتریکی', out: 'صوتی' },
    { e: '♨️', n: 'بخاری برقی', inp: 'الکتریکی', out: 'گرمایی' },
    { e: '☀️', n: 'پنل خورشیدی', inp: 'نورانی', out: 'الکتریکی' }
  ];
  impl.convert = function (root, ctx) {
    var devs = U.shuffle(DEV).slice(0, 4), done = [false, false, false, false], solved = false;
    var outs = U.shuffle(devs.map(function (d) { return d.out; }));
    root.innerHTML = '<div class="ped-hint">هر دستگاه، انرژی ورودی‌اش را به چه انرژی‌ای تبدیل می‌کند؟ برچسب انرژی را بکش و روی جای خالی رها کن (یا لمس کن و بعد جای خالی را لمس کن).</div>' +
      '<div class="en-bank"></div><div class="conv-list">' +
      devs.map(function (d, i) {
        return '<div class="conv-row" data-i="' + i + '"><div class="dev"><span>' + d.e + '</span>' + d.n + '<br><small class="muted">ورودی: ' + d.inp + '</small></div><div class="arrow">⮜</div><div class="tgt" data-i="' + i + '">؟</div></div>';
      }).join('') + '</div><div class="game-msg" aria-live="polite"></div>';
    var bank = root.querySelector('.en-bank'), used = {};
    function renderBank() { bank.innerHTML = outs.map(function (o, k) { return '<span class="en-chip' + (used[k] ? ' used' : '') + '" data-k="' + k + '" role="button" tabindex="0">' + U.esc(o) + '</span>'; }).join(''); }
    var dnd = U.dnd(root, {
      item: '.en-chip', drop: '.tgt',
      onDrop: function (chip, tgt) {
        if (solved) return;
        var i = Number(tgt.getAttribute('data-i')), k = Number(chip.getAttribute('data-k'));
        if (done[i]) return;
        var row = tgt.parentNode;
        if (outs[k] === devs[i].out) {
          done[i] = true; used[k] = true; tgt.textContent = outs[k] + ' ✓'; row.classList.add('ok'); Audio.play('correct'); renderBank();
          say(root, devs[i].n + ': انرژی ' + devs[i].inp + ' ← انرژی ' + devs[i].out, 'ok');
          if (done.every(Boolean)) { solved = true; say(root, 'همهٔ تبدیل‌ها را درست تشخیص دادی! 🎉', 'ok'); ctx.onSolved(); }
        } else {
          row.classList.add('bad'); Audio.play('wrong'); ctx.onFail();
          say(root, 'این تبدیل درست نیست؛ دوباره فکر کن.', 'bad');
          setTimeout(function () { row.classList.remove('bad'); }, 500);
        }
      }
    });
    renderBank();
    return { destroy: function () { dnd.destroy(); } };
  };

  /* اطلاعات نمایشی بازی‌ها (برای صفحهٔ «بازی‌های آزاد») */
  Games.META = {
    forest:   { emoji: '🌲', name: 'مسیر درست در جنگل' },
    crystals: { emoji: '💎', name: 'معمای کریستال‌های انرژی' },
    bridge:   { emoji: '🌉', name: 'عبور از پل شکلاتی' },
    chest:    { emoji: '🗝️', name: 'رمز صندوق گنج' },
    tools:    { emoji: '🧰', name: 'ابزار مناسب برای عبور از مانع' },
    convert:  { emoji: '🔄', name: 'چالش تشخیص تبدیل انرژی' }
  };
  Games.STORY = {
    forest:   { story: 'مه جنگل را پوشانده؛ در هر دوراهی باید مسیر درست را پیدا کنی.', goal: 'در سه دوراهی مسیر درست را انتخاب کن.', hint: 'انرژی جنبشی مربوط به حرکت است و انرژی پتانسیل یعنی انرژی ذخیره‌شده (ارتفاع، فنر فشرده، ...).' },
    crystals: { story: 'کریستال‌ها را بر اساس انرژی پتانسیل‌شان روی پایه‌ها بچین.', goal: 'کریستال‌ها را از کمترین تا بیشترین انرژی پتانسیل مرتب کن.', hint: 'انرژی پتانسیل با جرم و ارتفاع بیشتر می‌شود؛ جرم و ارتفاع هر کریستال را در هم ضرب کن و مقایسه کن.' },
    bridge:   { story: 'توپ طلایی باید از دو تپه بگذرد و اهرم پل را بزند.', goal: 'ارتفاع رهاسازی مناسب را پیدا کن.', hint: 'برای رسیدن به بالای تپه، انرژی پتانسیل اولیه باید از انرژی لازم برای آن ارتفاع بیشتر باشد؛ اصطکاک هم کمی انرژی می‌گیرد.' },
    chest:    { story: 'صندوق گنج سه قفل رقمی دارد و هر قفل یک سرنخ.', goal: 'رمز سه‌رقمی صندوق را پیدا کن.', hint: 'انرژی از بین نمی‌رود؛ هر سرنخ را با یک جمع یا تفریق ساده حل کن.' },
    tools:    { story: 'هر مانع به ابزار مخصوص خودش نیاز دارد.', goal: 'برای هر مانع ابزار مناسب را انتخاب کن.', hint: 'فکر کن مانع به نیرو، نور، گرما یا حرکت نیاز دارد، و کدام ابزار همان را فراهم می‌کند.' },
    convert:  { story: 'دستگاه‌ها انرژی را از شکلی به شکل دیگر تبدیل می‌کنند.', goal: 'خروجی انرژی هر دستگاه را مشخص کن.', hint: 'لامپ نور می‌دهد، پنکه می‌چرخد، بلندگو صدا می‌دهد، بخاری گرم می‌کند و پنل خورشیدی برق می‌سازد.' }
  };

  /* نقطهٔ ورود: type، عنصر میزبان و تابع onWin (پس از حل شدن فقط یک‌بار فراخوانی می‌شود) */
  Games.mount = function (type, root, onWin) {
    var solvedOnce = false, timer = 0, handle;
    handle = impl[type](root, {
      onSolved: function () {
        if (solvedOnce) return; solvedOnce = true;
        timer = setTimeout(function () { if (typeof onWin === 'function') onWin(); }, 900);
      },
      onFail: function () {}
    });
    return { destroy: function () { clearTimeout(timer); if (handle && handle.destroy) handle.destroy(); } };
  };
  EA.Games = Games;
})();

</script>
<script>
/* آزمایشگاه تعاملی فیزیک — شش آزمایش با انیمیشن، اسلایدر و نمایش لحظه‌ای نتایج */
(function () {
  'use strict';
  var EA = window.EA, U = EA.U;
  var Lab = {};
  var GR = 10; // شتاب گرانش (N/kg) مطابق کتاب درسی پایهٔ هفتم

  Lab.EXPERIMENTS = [
    { id: 'pe-ke', emoji: '🎢', name: 'پتانسیل ← جنبشی', desc: 'آونگ' },
    { id: 'freefall', emoji: '🪂', name: 'سقوط آزاد', desc: 'توپ در حال سقوط' },
    { id: 'ke', emoji: '🚗', name: 'جرم و سرعت', desc: 'انرژی جنبشی' },
    { id: 'spring', emoji: '🌀', name: 'فنر', desc: 'پتانسیل کشسانی' },
    { id: 'motor', emoji: '⚡', name: 'الکتریکی ← حرکتی', desc: 'موتور برقی' },
    { id: 'conserve', emoji: '♾️', name: 'پایستگی انرژی', desc: 'ترن هوایی' }
  ];

  /* ───────── ابزارهای مشترک ───────── */
  function mkCanvas(host, w, h) {
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    var c = document.createElement('canvas');
    c.className = 'stage'; c.width = w * dpr; c.height = h * dpr;
    host.appendChild(c);
    var g = c.getContext('2d'); g.scale(dpr, dpr);
    return { c: c, g: g, w: w, h: h };
  }
  function loop(fn) {
    var alive = true, raf = 0, last = performance.now();
    function f(now) {
      if (!alive) return;
      var dt = Math.min(0.05, (now - last) / 1000); last = now;
      fn(dt);
      raf = requestAnimationFrame(f);
    }
    raf = requestAnimationFrame(f);
    return function () { alive = false; cancelAnimationFrame(raf); };
  }
  function slider(id, label, min, max, step, val) {
    return '<div class="ctl"><label for="' + id + '">' + label + ' <b id="' + id + '-v"></b></label><input type="range" id="' + id + '" min="' + min + '" max="' + max + '" step="' + step + '" value="' + val + '"></div>';
  }
  function setBars(root, vals, max, unit) {
    var rows = root.querySelectorAll('.ebar');
    vals.forEach(function (v, i) {
      if (!rows[i]) return;
      rows[i].querySelector('i').style.width = U.clamp(max > 0 ? v / max * 100 : 0, 0, 100) + '%';
      rows[i].querySelector('.ebar-v').textContent = U.fa(Math.round(v * 10) / 10).replace('.', '٫') + ' ' + (unit || 'ژول');
    });
  }
  function shell(root, o) {
    root.innerHTML = '<div class="lab-grid"><div class="card glass"><h2>' + o.title + '</h2><div class="lab-canvas"></div>' +
      '<div class="row center" style="margin-top:10px">' + o.buttons + '</div></div>' +
      '<div class="card glass">' + o.controls + o.bars + (o.formula ? '<div class="formula" dir="ltr">' + o.formula + '</div>' : '') +
      '<div class="lab-note" aria-live="polite">' + o.note + '</div></div></div>';
    return root.querySelector('.lab-canvas');
  }
  function cloud(g, x, y) {
    g.fillStyle = 'rgba(255,255,255,.85)';
    g.beginPath(); g.arc(x, y, 14, 0, 7); g.arc(x + 16, y - 6, 17, 0, 7); g.arc(x + 34, y, 13, 0, 7); g.fill();
  }
  function sky(g, w, h) {
    var s = g.createLinearGradient(0, 0, 0, h); s.addColorStop(0, '#8bd3ff'); s.addColorStop(1, '#e6f7ff');
    g.fillStyle = s; g.fillRect(0, 0, w, h);
    cloud(g, 60, 36); cloud(g, w - 150, 60);
  }

  /* ═════════ ۱) آونگ: تبدیل پتانسیل به جنبشی ═════════ */
  var EXP = {};
  EXP['pe-ke'] = function (root) {
    var host = shell(root, {
      title: '🎢 آونگ: تبدیل انرژی پتانسیل به جنبشی',
      buttons: '<button class="btn btn-pink" id="go">▶ رها کن</button><button class="btn btn-ghost" id="rs">↩ از اول</button>',
      controls: slider('ang', 'زاویهٔ رها کردن', 10, 80, 1, 50) + slider('mass', 'جرم گلوله', 1, 10, 1, 2),
      bars: U.barsHtml([{ label: 'پتانسیل', cls: 'pe' }, { label: 'جنبشی', cls: 'ke' }, { label: 'مجموع', cls: 'tot' }], 'bars'),
      formula: 'PE = m × g × h &nbsp;|&nbsp; KE = ½ × m × v²',
      note: 'در بالاترین نقطه همهٔ انرژی «پتانسیل» است و در پایین‌ترین نقطه همه «جنبشی». مجموع هر دو (تقریباً) ثابت می‌ماند.'
    });
    var cv = mkCanvas(host, 520, 330), g = cv.g, L = 2, S = 80;
    var ang = root.querySelector('#ang'), mass = root.querySelector('#mass'), bars = root.querySelector('#bars');
    var th, w = 0, running = false, th0;
    function E0() { return Number(mass.value) * GR * L * (1 - Math.cos(th0)); }
    function sync() {
      th0 = Number(ang.value) * Math.PI / 180;
      root.querySelector('#ang-v').textContent = U.fa(ang.value) + ' درجه';
      root.querySelector('#mass-v').textContent = U.fa(mass.value) + ' کیلوگرم';
    }
    function reset() { sync(); th = th0; w = 0; running = false; root.querySelector('#go').textContent = '▶ رها کن'; }
    function energies() {
      var m = Number(mass.value);
      var pe = m * GR * L * (1 - Math.cos(th)), ke = 0.5 * m * Math.pow(L * w, 2);
      return [pe, ke, pe + ke];
    }
    function draw() {
      sky(g, cv.w, cv.h);
      var px = cv.w / 2, py = 30, bx = px + Math.sin(th) * L * S, by = py + Math.cos(th) * L * S;
      g.fillStyle = '#7b4a2d'; g.fillRect(px - 70, py - 14, 140, 14);
      // ردّ نقطهٔ رها کردن
      g.setLineDash([5, 6]); g.strokeStyle = '#7c4dff'; g.lineWidth = 2; g.beginPath();
      g.arc(px, py, L * S, Math.PI / 2 - th0 - 0.02, Math.PI / 2 + th0 + 0.02); g.stroke(); g.setLineDash([]);
      var hy = py + L * S; g.strokeStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.moveTo(40, hy); g.lineTo(cv.w - 40, hy); g.stroke();
      g.strokeStyle = '#444'; g.lineWidth = 3; g.beginPath(); g.moveTo(px, py); g.lineTo(bx, by); g.stroke();
      var r = 12 + Number(mass.value) * 1.6;
      var gr = g.createRadialGradient(bx - 5, by - 5, 3, bx, by, r); gr.addColorStop(0, '#fff6a8'); gr.addColorStop(1, '#ff9a3c');
      g.fillStyle = gr; g.beginPath(); g.arc(bx, by, r, 0, 7); g.fill(); g.strokeStyle = '#b45309'; g.lineWidth = 3; g.stroke();
      g.fillStyle = '#2b2250'; g.font = '700 20px sans-serif'; g.textAlign = 'left';
      g.fillText('h = ' + U.fd(L * (1 - Math.cos(th)), 2) + ' m', 14, cv.h - 14);
    }
    function update() { var e = energies(); setBars(bars, e, Math.max(E0(), 0.001) * 1.05); draw(); }
    var stop = loop(function (dt) {
      if (running) { var n = 24, h = dt / n; for (var i = 0; i < n; i++) { w += -(GR / L) * Math.sin(th) * h; th += w * h; } }
      update();
    });
    ang.addEventListener('input', function () { reset(); });
    mass.addEventListener('input', function () { sync(); });
    root.querySelector('#go').addEventListener('click', function () { running = !running; this.textContent = running ? '⏸ ایست' : '▶ ادامه'; });
    root.querySelector('#rs').addEventListener('click', reset);
    reset();
    return stop;
  };

  /* ═════════ ۲) سقوط آزاد ═════════ */
  EXP.freefall = function (root) {
    var host = shell(root, {
      title: '🪂 سقوط آزاد جسم',
      buttons: '<button class="btn btn-pink" id="go">⬇ رها کن</button><button class="btn btn-ghost" id="rs">↩ از اول</button>',
      controls: slider('hh', 'ارتفاع رها کردن', 2, 50, 1, 20) + slider('mm', 'جرم توپ آبی', 1, 10, 1, 2) +
        '<div class="stats-row"><div class="stat"><b id="r-t">—</b><span>زمان سقوط</span></div><div class="stat"><b id="r-v">—</b><span>سرعت برخورد (m/s)</span></div></div>',
      bars: U.barsHtml([{ label: 'پتانسیل', cls: 'pe' }, { label: 'جنبشی', cls: 'ke' }, { label: 'مجموع', cls: 'tot' }], 'bars'),
      formula: 'v = g × t &nbsp;|&nbsp; h = ½ g t²',
      note: 'دو توپ با هم رها می‌شوند: توپ آبی (جرم شما) و توپ قرمز که ۵ برابر سنگین‌تر است. هر دو (بدون مقاومت هوا) همزمان به زمین می‌رسند، اما توپ سنگین‌تر انرژی بیشتری دارد.'
    });
    var cv = mkCanvas(host, 520, 360), g = cv.g;
    var hh = root.querySelector('#hh'), mm = root.querySelector('#mm'), bars = root.querySelector('#bars');
    var t = 0, running = false, landed = false;
    function H() { return Number(hh.value); }
    function y(tt) { return Math.max(0, H() - 0.5 * GR * tt * tt); }
    function sync() {
      root.querySelector('#hh-v').textContent = U.fa(hh.value) + ' متر';
      root.querySelector('#mm-v').textContent = U.fa(mm.value) + ' کیلوگرم';
    }
    function reset() {
      sync(); t = 0; running = false; landed = false;
      root.querySelector('#r-t').textContent = '—'; root.querySelector('#r-v').textContent = '—';
    }
    function draw() {
      sky(g, cv.w, cv.h);
      var gy = cv.h - 34, top = 30, ppm = (gy - top - 16) / H();
      g.fillStyle = '#58b368'; g.fillRect(0, gy, cv.w, 34); g.fillStyle = '#3e9150'; g.fillRect(0, gy, cv.w, 6);
      g.strokeStyle = 'rgba(0,0,0,.25)'; g.fillStyle = '#2b2250'; g.font = '18px sans-serif'; g.textAlign = 'left';
      for (var k = 0; k <= 4; k++) {
        var mv = H() * k / 4, yy = gy - mv * ppm - 16;
        g.beginPath(); g.moveTo(8, yy); g.lineTo(26, yy); g.stroke(); g.fillText(U.fa(Math.round(mv)) + ' m', 30, yy + 4);
      }
      [[cv.w * 0.38, 16 + Number(mm.value) * 1.4, '#38a9ff'], [cv.w * 0.62, 16 + 5 * Number(mm.value) * 1.4 / 1.9, '#ff5a6a']].forEach(function (b) {
        var yy = gy - y(t) * ppm - b[1];
        var gr = g.createRadialGradient(b[0] - 4, yy - 4, 2, b[0], yy, b[1]); gr.addColorStop(0, '#fff'); gr.addColorStop(1, b[2]);
        g.fillStyle = gr; g.beginPath(); g.arc(b[0], yy, b[1], 0, 7); g.fill(); g.strokeStyle = 'rgba(0,0,0,.4)'; g.lineWidth = 2; g.stroke();
      });
    }
    var stop = loop(function (dt) {
      if (running) {
        t += dt;
        if (y(t) <= 0) {
          t = Math.sqrt(2 * H() / GR); running = false; landed = true;
          root.querySelector('#r-t').textContent = U.fd(t, 2) + ' ثانیه';
          root.querySelector('#r-v').textContent = U.fd(GR * t, 1);
          if (EA.Audio) EA.Audio.play('click');
        }
      }
      var m = Number(mm.value), pe = m * GR * y(t), ke = m * GR * (H() - y(t));
      setBars(bars, [pe, ke, pe + ke], m * GR * H() * 1.05);
      draw();
    });
    hh.addEventListener('input', reset); mm.addEventListener('input', sync);
    root.querySelector('#go').addEventListener('click', function () { if (landed) reset(); running = true; });
    root.querySelector('#rs').addEventListener('click', reset);
    reset();
    return stop;
  };

  /* ═════════ ۳) انرژی جنبشی: جرم و سرعت ═════════ */
  EXP.ke = function (root) {
    var host = shell(root, {
      title: '🚗 تأثیر جرم و سرعت بر انرژی جنبشی',
      buttons: '',
      controls: slider('m', 'جرم خودرو', 1, 10, 1, 4) + slider('v', 'سرعت خودرو', 0, 20, 1, 8) +
        '<div class="stats-row"><div class="stat"><b id="r-ke">—</b><span>انرژی جنبشی (ژول)</span></div></div>' +
        '<div class="lab-note" id="cmp"></div>',
      bars: U.barsHtml([{ label: 'انرژی جنبشی', cls: 'ke' }], 'bars'),
      formula: 'KE = ½ × m × v²',
      note: 'سرعت دو برابر شود، انرژی جنبشی ۴ برابر می‌شود؛ جرم دو برابر شود، ۲ برابر. به همین دلیل سرعت زیاد خطرناک‌تر است.'
    });
    var cv = mkCanvas(host, 520, 240), g = cv.g;
    var m = root.querySelector('#m'), v = root.querySelector('#v'), bars = root.querySelector('#bars'), x = 0, off = 0;
    function ke(mm, vv) { return 0.5 * mm * vv * vv; }
    function sync() {
      var M = Number(m.value), V = Number(v.value);
      root.querySelector('#m-v').textContent = U.fa(M) + ' کیلوگرم';
      root.querySelector('#v-v').textContent = U.fa(V) + ' متر بر ثانیه';
      root.querySelector('#r-ke').textContent = U.fa(Math.round(ke(M, V)));
      root.querySelector('#cmp').innerHTML = '🔍 اگر <b>سرعت دو برابر</b> شود: <b>' + U.fa(Math.round(ke(M, V * 2))) + ' ژول</b> (' + (V ? '۴ برابر' : '—') + ')<br>🔍 اگر <b>جرم دو برابر</b> شود: <b>' + U.fa(Math.round(ke(M * 2, V))) + ' ژول</b> (' + (V ? '۲ برابر' : '—') + ')';
    }
    function draw() {
      sky(g, cv.w, cv.h);
      var gy = cv.h - 50; g.fillStyle = '#6b6b78'; g.fillRect(0, gy, cv.w, 50);
      g.strokeStyle = '#fff'; g.lineWidth = 4; g.setLineDash([26, 22]); g.lineDashOffset = -off; g.beginPath(); g.moveTo(0, gy + 28); g.lineTo(cv.w, gy + 28); g.stroke(); g.setLineDash([]);
      var M = Number(m.value), V = Number(v.value), s = 0.8 + M * 0.05, cx = x, cy = gy - 6;
      g.save(); g.translate(cx, cy); g.scale(s, s);
      g.fillStyle = '#ff5c9d'; g.strokeStyle = '#8a1650'; g.lineWidth = 3;
      g.beginPath(); g.moveTo(-50, 0); g.lineTo(-50, -22); g.lineTo(-30, -26); g.lineTo(-18, -48); g.lineTo(22, -48); g.lineTo(36, -26); g.lineTo(52, -22); g.lineTo(52, 0); g.closePath(); g.fill(); g.stroke();
      g.fillStyle = '#bfe6ff'; g.fillRect(-12, -42, 14, 14); g.fillRect(6, -42, 14, 14);
      [-28, 30].forEach(function (wx) { g.fillStyle = '#2b2250'; g.beginPath(); g.arc(wx, 0, 11, 0, 7); g.fill(); g.fillStyle = '#ccc'; g.beginPath(); g.arc(wx, 0, 4, 0, 7); g.fill(); });
      g.restore();
      if (V > 0) { g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 3; for (var i = 0; i < Math.min(5, 1 + V / 4); i++) { g.beginPath(); g.moveTo(cx - 60 * s - i * 14, cy - 12 - i * 9); g.lineTo(cx - 60 * s - i * 14 - 12 - V, cy - 12 - i * 9); g.stroke(); } }
    }
    var stop = loop(function (dt) {
      var V = Number(v.value); x += V * 22 * dt; off += V * 22 * dt; if (x > cv.w + 90) x = -90;
      setBars(bars, [ke(Number(m.value), V)], 2000);
      draw();
    });
    m.addEventListener('input', sync); v.addEventListener('input', sync);
    sync();
    return stop;
  };

  /* ═════════ ۴) انرژی پتانسیل کشسانی فنر ═════════ */
  EXP.spring = function (root) {
    var host = shell(root, {
      title: '🌀 انرژی پتانسیل کشسانی فنر',
      buttons: '<button class="btn btn-pink" id="go">🚀 فنر را رها کن</button><button class="btn btn-ghost" id="rs">↩ دوباره</button>',
      controls: slider('x', 'میزان فشردگی فنر', 0, 40, 1, 20) + slider('k', 'سفتی فنر (k)', 50, 400, 10, 200) + slider('m', 'جرم جسم', 0.5, 3, 0.5, 1),
      bars: U.barsHtml([{ label: 'پتانسیل فنر', cls: 'pe' }, { label: 'جنبشی', cls: 'ke' }, { label: 'گرمای اصطکاک', cls: 'heat' }], 'bars'),
      formula: 'PE = ½ × k × x² &nbsp;|&nbsp; v = x × √(k/m)',
      note: 'وقتی فنر را بیشتر فشار می‌دهی، انرژی پتانسیل بیشتری ذخیره می‌شود و جسم سریع‌تر پرتاب می‌شود. بعد از پرتاب، اصطکاک کم‌کم انرژی جنبشی را به گرما تبدیل می‌کند تا جسم بایستد.'
    });
    var cv = mkCanvas(host, 560, 230), g = cv.g;
    var xs = root.querySelector('#x'), ks = root.querySelector('#k'), ms = root.querySelector('#m'), bars = root.querySelector('#bars');
    var MU = 0.3, phase = 'ready', d = 0, v = 0, E0 = 0, PPM = 17;
    function X() { return Number(xs.value) / 100; }
    function K() { return Number(ks.value); }
    function M() { return Number(ms.value); }
    function sync() {
      root.querySelector('#x-v').textContent = U.fa(xs.value) + ' سانتی‌متر';
      root.querySelector('#k-v').textContent = U.fa(ks.value) + ' نیوتن بر متر';
      root.querySelector('#m-v').textContent = U.fd(M(), 1) + ' کیلوگرم';
    }
    function reset() { sync(); phase = 'ready'; d = 0; v = 0; }
    function spring(x1, x2, y) {
      var n = 12, amp = 14; g.strokeStyle = '#8e63ff'; g.lineWidth = 4; g.lineJoin = 'round'; g.beginPath(); g.moveTo(x1, y);
      for (var i = 1; i < n * 2; i++) g.lineTo(x1 + (x2 - x1) * i / (n * 2), y + (i % 2 ? -amp : amp));
      g.lineTo(x2, y); g.stroke();
    }
    function draw() {
      sky(g, cv.w, cv.h);
      var fy = cv.h - 70; g.fillStyle = '#c9a36b'; g.fillRect(0, fy, cv.w, 70); g.fillStyle = '#a77f45'; g.fillRect(0, fy, cv.w, 6);
      g.fillStyle = '#6b6b78'; g.fillRect(10, fy - 90, 18, 90);
      var L0 = 150, bx0 = 28, bw = 46, bh = 46, nat = bx0 + L0, bxLeft;
      if (phase === 'ready') { var len = L0 - X() * 200 * 1.0; bxLeft = bx0 + len; spring(bx0, bxLeft, fy - 24); }
      else { bxLeft = nat + d * PPM; spring(bx0, nat, fy - 24); }
      g.fillStyle = '#ffd23f'; g.strokeStyle = '#b8860b'; g.lineWidth = 3; g.fillRect(bxLeft, fy - bh, bw, bh); g.strokeRect(bxLeft, fy - bh, bw, bh);
      g.fillStyle = '#b8860b'; g.font = '700 20px sans-serif'; g.textAlign = 'center'; g.fillText(U.fa(M()) .replace('.', '٫') + ' kg', bxLeft + bw / 2, fy - 18);
      if (phase !== 'ready') { g.fillStyle = '#2b2250'; g.textAlign = 'left'; g.fillText('مسافت: ' + U.fd(d, 1) + ' m', 14, 22); }
    }
    var stop = loop(function (dt) {
      var pe0 = 0.5 * K() * X() * X();
      if (phase === 'flying') {
        v -= MU * GR * dt; if (v <= 0) { v = 0; phase = 'stopped'; }
        d += v * dt;
      }
      var pe, ke, heat;
      if (phase === 'ready') { pe = pe0; ke = 0; heat = 0; E0 = pe0; }
      else { pe = 0; ke = 0.5 * M() * v * v; heat = Math.max(0, E0 - ke); }
      setBars(bars, [pe, ke, heat], Math.max(E0 || pe0, 0.01) * 1.02);
      draw();
    });
    function launch() {
      if (phase !== 'ready' || X() <= 0) return;
      E0 = 0.5 * K() * X() * X(); v = X() * Math.sqrt(K() / M()); d = 0; phase = 'flying';
      if (EA.Audio) EA.Audio.play('whoosh');
    }
    ['x', 'k', 'm'].forEach(function (id) { root.querySelector('#' + id).addEventListener('input', reset); });
    root.querySelector('#go').addEventListener('click', launch);
    root.querySelector('#rs').addEventListener('click', reset);
    reset();
    return stop;
  };

  /* ═════════ ۵) موتور: الکتریکی به حرکتی ═════════ */
  EXP.motor = function (root) {
    var host = shell(root, {
      title: '⚡ تبدیل انرژی الکتریکی به حرکتی',
      buttons: '<button class="btn btn-yellow" id="pw">⏻ موتور روشن است</button>',
      controls: slider('vv', 'ولتاژ باتری', 0, 12, 1, 6) + slider('ld', 'وزنهٔ آویزان', 0, 5, 1, 1),
      bars: U.barsHtml([{ label: 'ورودی الکتریکی', cls: 'el' }, { label: 'حرکتی مفید', cls: 'mo' }, { label: 'گرمایی هدررفته', cls: 'heat' }], 'bars'),
      formula: 'P = V² / R &nbsp;|&nbsp; η = P(motion) ÷ P(electric)',
      note: 'موتور همهٔ انرژی الکتریکی را حرکت نمی‌کند؛ بخشی از آن همیشه به گرما تبدیل می‌شود. هرچه وزنه سنگین‌تر باشد، بازده کمتر و گرمای بیشتری تولید می‌شود. اعداد برحسب ژول بر ثانیه (وات) هستند.'
    });
    var cv = mkCanvas(host, 480, 320), g = cv.g;
    var vv = root.querySelector('#vv'), ld = root.querySelector('#ld'), bars = root.querySelector('#bars'), pw = root.querySelector('#pw');
    var on = true, rot = 0, wy = 0, R = 6;
    function calc() {
      var V = on ? Number(vv.value) : 0, Ld = Number(ld.value);
      var pin = V * V / R, eta = V > 0 ? U.clamp(0.85 - 0.08 * Ld, 0.25, 0.9) : 0;
      return { pin: pin, pm: pin * eta, ph: pin * (1 - eta), eta: eta };
    }
    function sync() {
      root.querySelector('#vv-v').textContent = U.fa(vv.value) + ' ولت';
      root.querySelector('#ld-v').textContent = U.fa(ld.value) + ' واحد';
    }
    function draw(c) {
      sky(g, cv.w, cv.h);
      g.fillStyle = '#c9a36b'; g.fillRect(0, cv.h - 30, cv.w, 30);
      g.fillStyle = '#6b6b78'; g.fillRect(110, 30, 14, 240); g.fillRect(90, 262, 54, 14);
      var cx = 180, cy = 70, r = 38;
      g.save(); g.translate(cx, cy); g.rotate(rot);
      g.fillStyle = '#e9e0ff'; g.strokeStyle = '#5a2fd6'; g.lineWidth = 4; g.beginPath(); g.arc(0, 0, r, 0, 7); g.fill(); g.stroke();
      for (var i = 0; i < 4; i++) { g.rotate(Math.PI / 2); g.fillStyle = '#7c4dff'; g.fillRect(-4, -r + 4, 8, r - 8); }
      g.restore(); g.fillStyle = '#2b2250'; g.beginPath(); g.arc(cx, cy, 7, 0, 7); g.fill();
      // طناب و وزنه
      var topY = cy + r, bot = 280 - 40 - wy;
      g.strokeStyle = '#7b4a2d'; g.lineWidth = 3; g.beginPath(); g.moveTo(cx - r, cy); g.lineTo(cx - r, bot); g.stroke();
      var ww = 20 + Number(ld.value) * 6;
      g.fillStyle = '#ff9a3c'; g.strokeStyle = '#8a4a00'; g.lineWidth = 3; g.fillRect(cx - r - ww / 2, bot, ww, ww * 0.9); g.strokeRect(cx - r - ww / 2, bot, ww, ww * 0.9);
      g.fillStyle = '#fff'; g.font = '700 18px sans-serif'; g.textAlign = 'center'; g.fillText(U.fa(Number(ld.value)), cx - r, bot + ww * 0.6);
      // باتری و سیم
      g.fillStyle = '#4ade80'; g.strokeStyle = '#166534'; g.lineWidth = 3; g.fillRect(300, 190, 90, 60); g.strokeRect(300, 190, 90, 60);
      g.fillStyle = '#166534'; g.fillRect(390, 210, 10, 20); g.font = '700 22px sans-serif'; g.fillText(U.fa(on ? vv.value : 0) + ' V', 345, 226);
      g.strokeStyle = on ? '#ffd23f' : '#aaa'; g.lineWidth = 5; g.beginPath(); g.moveTo(300, 220); g.lineTo(250, 220); g.lineTo(250, cy); g.lineTo(cx + r, cy); g.stroke();
      if (on && Number(vv.value) > 0) { g.fillStyle = '#fff'; for (var k = 0; k < 4; k++) { var t = ((performance.now() / 600) + k / 4) % 1; g.beginPath(); g.arc(300 - 50 * t, 220, 4, 0, 7); g.fill(); } }
      g.fillStyle = '#2b2250'; g.textAlign = 'left'; g.font = '700 20px sans-serif'; g.fillText('بازده: ' + U.fa(Math.round(c.eta * 100)) + '٪', 290, 280);
    }
    var stop = loop(function (dt) {
      var c = calc();
      rot += c.pm / (1 + Number(ld.value)) * 0.18 * dt * 6;
      wy = (wy + c.pm / (1 + Number(ld.value)) * 0.9 * dt * 6) % 150;
      setBars(bars, [c.pin, c.pm, c.ph], 26, 'ژول/ثانیه');
      draw(c);
    });
    vv.addEventListener('input', sync); ld.addEventListener('input', sync);
    pw.addEventListener('click', function () { on = !on; pw.textContent = on ? '⏻ موتور روشن است' : '⏻ موتور خاموش است'; });
    sync();
    return stop;
  };

  /* ═════════ ۶) پایستگی انرژی: ترن هوایی ═════════ */
  EXP.conserve = function (root) {
    var host = shell(root, {
      title: '♾️ قانون پایستگی انرژی (ترن هوایی)',
      buttons: '<button class="btn btn-pink" id="go">▶ رها کن</button><button class="btn btn-ghost" id="rs">↩ از اول</button>',
      controls: slider('mu', 'اصطکاک ریل', 0, 15, 1, 0) + slider('mm', 'جرم واگن', 1, 10, 1, 2),
      bars: U.barsHtml([{ label: 'پتانسیل', cls: 'pe' }, { label: 'جنبشی', cls: 'ke' }, { label: 'گرمای اصطکاک', cls: 'heat' }, { label: 'مجموع همه', cls: 'tot' }], 'bars'),
      formula: 'E total = PE + KE + Heat = constant',
      note: 'بدون اصطکاک، واگن همیشه به همان ارتفاع اول برمی‌گردد. با اصطکاک، بخشی از انرژی به گرما تبدیل می‌شود و ارتفاع کم می‌شود، ولی مجموع همهٔ انرژی‌ها همچنان ثابت است؛ یعنی انرژی از بین نمی‌رود.'
    });
    var cv = mkCanvas(host, 560, 300), g = cv.g;
    var mu = root.querySelector('#mu'), mm = root.querySelector('#mm'), bars = root.querySelector('#bars');
    var LEN = 40, AMP = 4, X0 = 1.5, s, running = false, sx, sv, heat;
    function Y(x) { return AMP + AMP * Math.cos(2 * Math.PI * x / LEN); }
    function dY(x) { return -AMP * 2 * Math.PI / LEN * Math.sin(2 * Math.PI * x / LEN); }
    function MU() { return Number(mu.value) / 100; }
    function sync() {
      root.querySelector('#mu-v').textContent = Number(mu.value) === 0 ? 'بدون اصطکاک' : U.fa(mu.value) + ' از ۱۰۰';
      root.querySelector('#mm-v').textContent = U.fa(mm.value) + ' کیلوگرم';
    }
    function reset() { sync(); sx = X0; sv = 0; heat = 0; running = false; root.querySelector('#go').textContent = '▶ رها کن'; }
    function E0() { return Number(mm.value) * GR * Y(X0); }
    var PX = 520 / LEN, PY = 28;
    function X2(x) { return 20 + x * PX; }
    function Y2(y) { return cv.h - 24 - y * PY; }
    function draw() {
      sky(g, cv.w, cv.h);
      g.beginPath(); g.moveTo(X2(0), cv.h); for (var x = 0; x <= LEN; x += 0.5) g.lineTo(X2(x), Y2(Y(x))); g.lineTo(X2(LEN), cv.h); g.closePath();
      g.fillStyle = '#a4683a'; g.fill(); g.strokeStyle = '#ff5c9d'; g.lineWidth = 5; g.stroke();
      g.setLineDash([5, 6]); g.strokeStyle = '#7c4dff'; g.lineWidth = 2; g.beginPath(); g.moveTo(X2(0), Y2(Y(X0))); g.lineTo(X2(LEN), Y2(Y(X0))); g.stroke(); g.setLineDash([]);
      g.fillStyle = '#7c4dff'; g.font = '700 18px sans-serif'; g.textAlign = 'left'; g.fillText('ارتفاع اولیه', 28, Y2(Y(X0)) - 6);
      var th = Math.atan(dY(sx)), cx = X2(sx), cy = Y2(Y(sx));
      g.save(); g.translate(cx, cy); g.rotate(-th); g.fillStyle = '#ffd23f'; g.strokeStyle = '#8a4a00'; g.lineWidth = 3;
      g.fillRect(-20, -26, 40, 18); g.strokeRect(-20, -26, 40, 18); g.fillStyle = '#2b2250'; [-12, 12].forEach(function (wx) { g.beginPath(); g.arc(wx, -6, 6, 0, 7); g.fill(); }); g.restore();
    }
    var stop = loop(function (dt) {
      var M = Number(mm.value);
      if (running) {
        var n = Math.ceil(dt / 0.002), h = dt / n;
        for (var i = 0; i < n; i++) {
          var th = Math.atan(dY(sx)), sg = sv >= 0 ? 1 : -1, a = -GR * Math.sin(th) - (sv !== 0 || true ? MU() * GR * Math.cos(th) * sg : 0);
          var v0 = sv; sv += a * h;
          if (MU() > 0 && v0 !== 0 && ((v0 > 0) !== (sv > 0)) && Math.abs(Math.sin(th)) * GR < MU() * GR * Math.cos(th)) sv = 0;
          var ds = Math.abs(sv) * h / Math.cos(th); heat += MU() * GR * Math.cos(th) * ds * M;
          sx += sv * Math.cos(th) * h;
          if (sx < 0) { sx = 0; sv = Math.abs(sv); } if (sx > LEN) { sx = LEN; sv = -Math.abs(sv); }
        }
      }
      var pe = M * GR * Y(sx), ke = 0.5 * M * sv * sv, tot = pe + ke + heat;
      setBars(bars, [pe, ke, heat, tot], E0() * 1.02);
      draw();
    });
    mu.addEventListener('input', function () { sync(); }); mm.addEventListener('input', reset);
    root.querySelector('#go').addEventListener('click', function () { running = !running; this.textContent = running ? '⏸ ایست' : '▶ ادامه'; });
    root.querySelector('#rs').addEventListener('click', reset);
    reset();
    return stop;
  };

  /* نقطهٔ ورود: root را پر می‌کند و تابع نابودکننده برمی‌گرداند */
  Lab.mount = function (id, root) {
    var fn = EXP[id];
    if (!fn) { root.innerHTML = '<p>این آزمایش پیدا نشد.</p>'; return function () {}; }
    return fn(root);
  };

  EA.Lab = Lab;
})();

</script>
<script>
/* هستهٔ برنامه: وضعیت، مسیریابی، نوار بالا، جایزه‌ها، تنظیمات، پشتیبان‌گیری و (اختیاری) سرور */
(function () {
  'use strict';
  var EA = window.EA, U = EA.U, Store = EA.Store, A = EA.Audio, Art = EA.Art, C = EA.CONFIG;
  var App = {}, routes = {}, acts = {}, leaves = [];
  var S = { p: null, teacherOk: false, celebrate: null };
  App.S = S;

  App.reg = function (n, f) { routes[n] = f; };
  App.act = function (n, f) { acts[n] = f; };
  App.onLeave = function (f) { leaves.push(f); };
  function runLeaves() { var l = leaves; leaves = []; l.forEach(function (f) { try { f(); } catch (e) { console.error(e); } }); }

  App.save = function () { if (S.p) Store.saveProfile(S.p); };

  App.award = function (xp, coins) {
    var before = Store.levelInfo(S.p.xp);
    S.p.xp += xp; S.p.coins += coins; S.p.coinsEarned = (S.p.coinsEarned || 0) + coins;
    var after = Store.levelInfo(S.p.xp);
    App.refreshTop();
    if (after.level > before.level) { A.play('reward'); U.toast('🆙 سطح جدید: ' + after.name, 'good'); return after; }
    return null;
  };

  /* ───────── مسیریابی با hash (دکمهٔ «بازگشت» موبایل هم کار می‌کند) ───────── */
  var NEED_PROFILE = { map: 1, region: 1, quiz: 1, puzzle: 1, report: 1, full: 1, shop: 1 };
  function route() {
    runLeaves(); U.closeAllModals();
    var h = (location.hash || '').replace(/^#\/?/, '') || 'home';
    var parts = h.split('/'), name = parts[0], param = parts[1];
    if (!routes[name]) { name = 'home'; param = null; }
    S.p = Store.current();
    App.refreshTop();
    if (NEED_PROFILE[name] && !S.p) { name = 'home'; param = null; }
    S.route = name; S.param = param;
    try { routes[name](param); }
    catch (e) { console.error(e); App.render('<div class="card"><h2>خطای غیرمنتظره</h2><p>' + U.esc(e.message) + '</p><button class="btn" data-act="home">بازگشت به صفحهٔ اصلی</button></div>'); }
  }
  App.refresh = route;
  App.go = function (path) {
    var target = '#/' + path;
    if (location.hash === target) route(); else location.hash = target;
  };
  App.render = function (html, cls) {
    var m = document.getElementById('screen');
    m.innerHTML = '<div class="screen ' + (cls || '') + '">' + html + '</div>';
    window.scrollTo(0, 0);
  };

  /* ───────── نوار بالا ───────── */
  App.refreshTop = function () {
    var p = S.p, st = A.get();
    var html = '<a class="brand" data-act="home" href="#/home" aria-label="صفحهٔ اصلی">⚡ <span>سرزمین انرژی</span></a>';
    if (p) {
      html += '<span class="chip coin" title="سکه‌ها">🪙 ' + U.fa(p.coins) + '</span>' +
        '<span class="chip xp" title="امتیاز تجربه">⭐ ' + U.fa(p.xp) + '</span>';
    }
    html += '<button class="icon-btn" data-act="toggle-music" aria-label="قطع و وصل موسیقی" title="موسیقی">' + (st.music ? '🎵' : '🔇') + '</button>' +
      '<button class="icon-btn" data-act="settings" aria-label="تنظیمات" title="تنظیمات">⚙️</button>';
    document.getElementById('topbar').innerHTML = html;
  };

  /* ───────── پنجرهٔ جایزه ───────── */
  App.rewardModal = function (o) {
    var loot = '';
    if (o.xp) loot += '<span>⭐ +' + U.fa(o.xp) + '</span>';
    if (o.coins) loot += '<span>🪙 +' + U.fa(o.coins) + '</span>';
    A.play('reward');
    return U.modal('<div class="reward-pop"><span class="big">' + (o.emoji || '🎁') + '</span><h2>' + U.esc(o.title) + '</h2>' +
      (o.text ? '<p class="modal-text">' + U.esc(o.text) + '</p>' : '') + (loot ? '<div class="loot">' + loot + '</div>' : '') +
      '<div class="modal-actions"><button class="btn btn-green btn-lg" data-close="ok">' + U.esc(o.button || 'ادامه') + '</button></div></div>',
      { sticky: !!o.sticky, onClose: o.onClose });
  };

  /* ───────── اکشن‌ها (data-act) ───────── */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var name = el.getAttribute('data-act');
    if (name === 'home' && el.tagName === 'A') e.preventDefault();
    if (el.matches('.btn,.icon-btn,.node,.char-btn,.pp,.chip-btn,.lab-tabs button,.item .btn')) A.play('click');
    if (acts[name]) { try { acts[name](el, e); } catch (err) { console.error(err); } }
  });
  var unlockOnce = function () { A.unlock(); document.removeEventListener('pointerdown', unlockOnce); document.removeEventListener('keydown', unlockOnce); };
  document.addEventListener('pointerdown', unlockOnce);
  document.addEventListener('keydown', unlockOnce);

  App.act('home', function () { App.go('home'); });
  App.act('go', function (el) { App.go(el.getAttribute('data-to')); });
  App.act('toggle-music', function () { var on = !A.get().music; A.setMusic(on); App.refreshTop(); U.toast(on ? 'موسیقی روشن شد 🎵' : 'موسیقی خاموش شد'); });

  /* ───────── راه دور (اختیاری) ───────── */
  App.remote = {
    on: function () { return !!(C.REMOTE && C.REMOTE.enabled && C.REMOTE.baseUrl); },
    submit: function (p) {
      if (!App.remote.on()) return Promise.resolve(false);
      return fetch(C.REMOTE.baseUrl.replace(/\/$/, '') + '/api/scores', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: p.id, name: p.name, character: p.character, xp: p.xp, regions: p.badges.length, badges: p.badges, equipped: p.equipped })
      }).then(function (r) { return r.ok; }).catch(function () { return false; });
    },
    board: function () {
      return fetch(C.REMOTE.baseUrl.replace(/\/$/, '') + '/api/scores').then(function (r) { if (!r.ok) throw new Error('bad'); return r.json(); });
    }
  };

  /* ───────── تنظیمات، صدا و پشتیبان ───────── */
  function stamp() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  App.stamp = stamp;
  App.act('settings', function () {
    var st = A.get(), p = S.p;
    var m = U.modal('<h2>⚙️ تنظیمات</h2><div class="settings-list">' +
      '<label class="switch"><span>🎵 موسیقی پس‌زمینه</span><input type="checkbox" id="s-music" ' + (st.music ? 'checked' : '') + '></label>' +
      '<label class="switch"><span>🔔 افکت‌های صوتی</span><input type="checkbox" id="s-sfx" ' + (st.sfx ? 'checked' : '') + '></label>' +
      '<div class="ctl"><label for="s-vol">🔊 شدت صدا <b id="s-vol-v">' + U.fa(Math.round(st.volume * 100)) + '٪</b></label><input type="range" id="s-vol" min="0" max="1" step="0.05" value="' + st.volume + '"></div>' +
      '<div class="divider"></div>' +
      '<b>پشتیبان‌گیری از اطلاعات</b><p class="muted">پیشرفت، سکه‌ها، آواتار و سؤال‌های معلم فقط روی همین مرورگر ذخیره می‌شوند. برای انتقال به دستگاه دیگر یا ایمن ماندن از پاک شدن اطلاعات مرورگر، فایل پشتیبان بگیرید.</p>' +
      '<div class="row"><button class="btn btn-blue btn-sm" data-act="backup-export">⬇️ دانلود فایل پشتیبان</button><button class="btn btn-yellow btn-sm" data-act="backup-import">⬆️ بازیابی از فایل</button></div>' +
      '<div class="divider"></div>' +
      (p ? '<button class="btn btn-red btn-sm" data-act="delete-profile">🗑️ حذف قهرمان «' + U.esc(p.name) + '»</button>' : '') +
      '<button class="btn btn-red btn-sm" data-act="wipe-all">⚠️ پاک کردن همهٔ اطلاعات این برنامه</button>' +
      '<p class="muted">همهٔ صداها و موسیقی با کد ساخته می‌شوند و فایل صوتی خارجی یا مجوز جداگانه‌ای ندارند.</p>' +
      '</div><div class="modal-actions"><button class="btn btn-green" data-close="ok">بستن</button></div>');
    m.el.querySelector('#s-music').addEventListener('change', function (e) { A.unlock(); A.setMusic(e.target.checked); App.refreshTop(); });
    m.el.querySelector('#s-sfx').addEventListener('change', function (e) { A.setSfx(e.target.checked); A.play('click'); });
    m.el.querySelector('#s-vol').addEventListener('input', function (e) {
      A.unlock(); A.setVolume(e.target.value); m.el.querySelector('#s-vol-v').textContent = U.fa(Math.round(e.target.value * 100)) + '٪';
    });
    m.el.querySelector('#s-vol').addEventListener('change', function () { A.play('coin'); });
  });
  App.act('backup-export', function () {
    var data = Store.exportBackup();
    U.download('energy-adventure-backup-' + stamp() + '.json', JSON.stringify(data, null, 2));
    U.toast('فایل پشتیبان دانلود شد ✅', 'good');
  });
  App.act('backup-import', function () {
    U.pickFile('.json,application/json').then(function (f) {
      if (!f) return;
      var obj;
      try { obj = JSON.parse(f.text); } catch (e) { U.alert('این فایل یک JSON معتبر نیست.'); return; }
      if (!obj || obj.format !== 'energy-adventure-backup') { U.alert('این فایل، پشتیبان سرزمین انرژی نیست. (اگر فایل «بانک سؤال» دارید، آن را از پنل معلم وارد کنید.)'); return; }
      U.confirm('با بازیابی، همهٔ اطلاعات فعلی این مرورگر (قهرمان‌ها و سؤال‌های معلم) با محتوای فایل جایگزین می‌شود. ادامه می‌دهید؟', 'بازیابی کن', 'انصراف', true).then(function (ok) {
        if (!ok) return;
        var r = Store.importBackup(obj);
        if (!r.ok) { U.alert(r.msg); return; }
        A.init(Store.settings()); U.closeAllModals(); U.toast('✅ ' + r.msg + ' (' + U.fa(r.profiles) + ' قهرمان)', 'good');
        App.go('home'); App.refresh();
      });
    });
  });
  App.act('delete-profile', function () {
    var p = S.p; if (!p) return;
    U.confirm('قهرمان «' + p.name + '» و همهٔ پیشرفتش برای همیشه حذف شود؟ (اگر پشتیبان نگرفته‌اید، قابل بازگشت نیست.)', 'حذف شود', 'انصراف', true).then(function (ok) {
      if (!ok) return; Store.deleteProfile(p.id); Store.setCurrent(null); U.closeAllModals(); U.toast('قهرمان حذف شد'); App.go('home'); App.refresh();
    });
  });
  App.act('wipe-all', function () {
    U.confirm('همهٔ اطلاعات برنامه (قهرمان‌ها، سکه‌ها، سؤال‌های اضافه‌شده، تنظیمات) پاک می‌شود. مطمئن هستید؟', 'همه را پاک کن', 'انصراف', true).then(function (ok) {
      if (!ok) return; Store.wipeAll(); A.init(Store.settings()); U.closeAllModals(); S.teacherOk = false; U.toast('همه‌چیز پاک شد'); App.go('home'); App.refresh();
    });
  });

  /* ───────── راه‌اندازی ───────── */
  App.boot = function () {
    A.init(Store.settings());
    window.addEventListener('hashchange', route);
    route();
  };

  EA.App = App;
})();

</script>
<script>
/* صفحه‌های بازی: خانه، نقشه، منطقه، آزمون ۱۵ ثانیه‌ای، معما، کارنامه */
(function () {
  'use strict';
  var EA = window.EA, U = EA.U, Store = EA.Store, A = EA.Audio, Art = EA.Art, C = EA.CONFIG, App = EA.App, S = App.S, G = EA.Games;
  var R = C.REGIONS;

  var FACTS = [
    'ژول (J) یکای انرژی است؛ بالا بردن یک سیب کوچک به اندازهٔ یک متر حدود یک ژول انرژی می‌خواهد.',
    'خورشید انرژی زندگی روی زمین است؛ گیاهان با فتوسنتز آن را به انرژی شیمیایی تبدیل می‌کنند.',
    'در هر تبدیل انرژی، بخشی به گرما تبدیل می‌شود؛ برای همین هیچ ماشینی بازده ۱۰۰٪ ندارد.',
    'آب پشت سد انرژی پتانسیل دارد و هنگام سقوط، توربین نیروگاه برق‌آبی را می‌چرخاند.',
    'انرژی جنبشی با مجذور سرعت زیاد می‌شود: سرعت دو برابر، انرژی چهار برابر!',
    'فنر فشرده‌شده و کمان کشیده‌شده انرژی پتانسیل کشسانی ذخیره می‌کنند.',
    'باد، آب و نور خورشید منابع انرژی تجدیدپذیر هستند و تمام نمی‌شوند.',
    'انرژی نه ساخته می‌شود و نه از بین می‌رود؛ فقط از شکلی به شکل دیگر تبدیل می‌شود.'
  ];

  function P() { return S.p; }
  function done(p, r) { return !!(p.regions[r] && p.regions[r].done); }
  function unlocked(p, r) { return r === 1 || done(p, r - 1); }
  function currentRegion(p) { for (var r = 1; r <= 4; r++) if (!done(p, r)) return r; return 4; }
  function avatar(p, cls) { return Art.avatar(p.character, p.equipped, cls); }
  function charName(id) { var c = C.CHARACTERS.filter(function (x) { return x.id === id; })[0]; return c ? c.name : ''; }
  function backLink(to, label) { return '<button class="back-link" data-act="go" data-to="' + to + '">→ ' + U.esc(label) + '</button>'; }

  /* ═════════════ صفحهٔ شروع ═════════════ */
  var draftChar = 'wizard';
  App.reg('home', function () {
    var p = P(), list = Store.profileList();
    if (p) draftChar = draftChar || p.character;
    var li = p ? Store.levelInfo(p.xp) : null;

    var warn = Store.isPersistent() ? '' : '<div class="warn-box">⚠️ مرورگر اجازهٔ ذخیره‌سازی نمی‌دهد (شاید در حالت خصوصی هستید). پیشرفت بعد از بستن صفحه از بین می‌رود؛ از «تنظیمات» پشتیبان بگیرید.</div>';

    var current = '';
    if (p) {
      var runTxt = p.run ? '<div class="muted">مرحلهٔ نیمه‌کاره: ' + R[p.run.region - 1].emoji + ' ' + R[p.run.region - 1].name + '</div>' : '';
      current = '<section class="card purple"><div class="row"><div style="width:84px">' + avatar(p) + '</div><div class="grow"><h2 style="margin:0">' + U.esc(p.name) + '</h2>' +
        '<div class="muted">' + U.esc(charName(p.character)) + ' · سطح ' + U.fa(li.level) + ': <b>' + li.name + '</b></div>' + runTxt + '</div></div>' +
        '<div class="level-bar" style="margin-top:8px"><i style="width:' + Math.round(li.progress * 100) + '%"></i></div>' +
        '<div class="muted" style="text-align:center">' + (li.next ? U.fa(li.next - p.xp) + ' امتیاز تا سطح بعد' : 'بالاترین سطح 🏆') + '</div>' +
        '<div class="stats-row"><div class="stat"><b>🪙 ' + U.fa(p.coins) + '</b><span>سکه</span></div><div class="stat"><b>⭐ ' + U.fa(p.xp) + '</b><span>امتیاز</span></div>' +
        '<div class="stat"><b>🏅 ' + U.fa(p.badges.length) + '</b><span>نشان</span></div></div>' +
        '<button class="btn btn-green btn-lg btn-block" data-act="continue">▶️ ادامه بازی قبلی</button></section>';
    }

    var chars = C.CHARACTERS.map(function (c) {
      return '<button class="char-btn" data-act="pick-char" data-id="' + c.id + '" aria-pressed="' + (c.id === draftChar) + '">' + Art.avatar(c.id, {}) + c.name + '</button>';
    }).join('');

    var profs = list.length > 1 ? '<section class="card"><h2>🧑‍🤝‍🧑 قهرمان‌های ذخیره‌شده</h2><div class="profile-pick">' + list.map(function (q) {
      return '<button class="pp" data-act="switch" data-id="' + q.id + '" aria-pressed="' + (p && q.id === p.id) + '">' + Art.avatar(q.character, q.equipped) + U.esc(q.name) + '</button>';
    }).join('') + '</div></section>' : '';

    var form = '<section class="card"><h2>' + (p ? '➕ قهرمان تازه' : '🌟 ماجراجویی را شروع کن') + '</h2>' + warn +
      '<label class="field"><span>نام یا نام مستعار</span><input class="input" id="name" maxlength="20" autocomplete="off" placeholder="مثلاً: ستارهٔ انرژی"></label>' +
      '<div class="field"><span>شخصیت خودت را انتخاب کن</span><div class="char-grid">' + chars + '</div></div>' +
      '<button class="btn btn-pink btn-lg btn-block" data-act="start">⚔️ شروع ماجراجویی</button></section>';

    var nav = '<section class="card"><div class="row center">' +
      '<button class="btn btn-blue" data-act="go" data-to="lab">🔬 آزمایشگاه</button>' +
      '<button class="btn btn-yellow" data-act="go" data-to="play">🎮 بازی‌های آزاد</button>' +
      (p ? '<button class="btn btn-pink" data-act="go" data-to="shop">👗 آواتار و فروشگاه</button>' : '') +
      '<button class="btn btn-green" data-act="go" data-to="board">🏆 رتبه‌بندی</button>' +
      '<button class="btn btn-ghost" data-act="go" data-to="teacher">📝 مدیریت سؤال‌ها</button></div></section>';

    App.render('<div class="hero">' + Art.hero() + '<div class="hero-title"><h1>سرزمین اسرارآمیز انرژی</h1><small>Energy Adventure</small></div></div>' +
      '<div class="home-grid"><div class="stack">' + (p ? current + profs + nav : form) + '</div><div class="stack">' + (p ? form : nav) + '</div></div>' +
      '<p class="footer-note">آزمون فیزیک پایهٔ هفتم · فصل انرژی</p>');
  });
  App.act('pick-char', function (el) {
    draftChar = el.getAttribute('data-id');
    Array.prototype.forEach.call(document.querySelectorAll('.char-btn'), function (b) { b.setAttribute('aria-pressed', b === el); });
  });
  App.act('switch', function (el) { Store.setCurrent(el.getAttribute('data-id')); App.refresh(); });
  App.act('start', function () {
    var inp = document.getElementById('name'), name = (inp.value || '').replace(/\s+/g, ' ').trim();
    if (!name) { U.toast('اول نام یا نام مستعار را بنویس 🙂', 'bad'); inp.focus(); return; }
    var ex = Store.findByName(name);
    if (ex) {
      U.confirm('قهرمانی با نام «' + ex.name + '» وجود دارد. می‌خواهی با همان ادامه بدهی؟', 'بله، ادامه', 'نه، نام دیگر').then(function (ok) {
        if (ok) { Store.setCurrent(ex.id); App.go('map'); App.refresh(); } else { inp.focus(); }
      });
      return;
    }
    var np = Store.createProfile(name, draftChar);
    Store.setCurrent(np.id); A.play('reward'); App.go('map'); App.refresh();
  });
  App.act('continue', function () {
    var p = P(); if (!p) return;
    if (p.run && p.run.phase === 'quiz') App.go('quiz'); else if (p.run && p.run.phase === 'puzzle') App.go('puzzle'); else App.go('map');
  });

  /* ═════════════ نقشهٔ ماجراجویی ═════════════ */
  App.reg('map', function () {
    var p = P(), li = Store.levelInfo(p.xp), cur = currentRegion(p), doneCount = p.badges.length;
    var nodes = R.map(function (r) {
      var st = done(p, r.id) ? 'done' : (unlocked(p, r.id) ? 'current' : 'locked');
      var pos = Art.NODES[r.id];
      var prog = '';
      if (p.run && p.run.region === r.id && p.run.phase !== 'done') prog = 'در حال انجام: ' + U.fa(Math.min(p.run.answers.length, p.run.qids.length)) + ' از ' + U.fa(p.run.qids.length);
      else if (st === 'done') prog = 'تکمیل ✓ · بهترین: ' + U.fa(p.regions[r.id].best || 0) + '٪';
      else if (st === 'locked') prog = 'قفل است';
      else prog = 'آماده ورود';
      return '<button class="node ' + st + '" style="left:' + (pos.x / 4) + '%;top:' + (pos.y / 7.2) + '%" data-act="region" data-id="' + r.id + '" aria-label="' + U.esc(r.name) + ' — ' + prog + '">' +
        '<span class="orb">' + r.emoji + (st === 'done' ? '<span class="ncheck">✓</span>' : '') + (st === 'locked' ? '<span class="nlock">🔒</span>' : '') + '</span>' +
        '<span class="nlabel">' + U.esc(r.name) + '</span><span class="nprog">' + prog + '</span></button>';
    }).join('');
    var ap = Art.NODES[cur], side = ap.x < 200 ? 1 : -1;
    var avatarEl = '<div class="map-avatar" style="left:' + ((ap.x + side * 62) / 4) + '%;top:' + ((ap.y + 22) / 7.2) + '%">' + avatar(p) + '</div>';
    var badges = R.map(function (r) { return '<div class="bd">' + Art.badge(r.id, !done(p, r.id)) + (done(p, r.id) ? r.badge : '؟') + '</div>'; }).join('');
    var chestsLeft = p.chests.filter(function (c) { return !c.opened; }).length;
    var runBtn = p.run ? '<button class="btn btn-green btn-block" data-act="continue">▶️ ادامهٔ مرحلهٔ نیمه‌کاره</button>' : '';

    App.render(backLink('home', 'صفحهٔ اصلی') + '<h1 class="page-title">🗺️ نقشهٔ ماجراجویی</h1><div class="map-layout">' +
      '<div class="map-wrap">' + Art.map(doneCount) + nodes + avatarEl + '</div>' +
      '<div class="map-side"><div class="card purple"><div class="row"><div style="width:70px">' + avatar(p) + '</div><div class="grow"><b>' + U.esc(p.name) + '</b><div class="muted">سطح ' + U.fa(li.level) + ': ' + li.name + '</div></div></div>' +
      '<div class="level-bar" style="margin-top:6px"><i style="width:' + Math.round(li.progress * 100) + '%"></i></div>' +
      '<div class="stats-row"><div class="stat"><b>🪙 ' + U.fa(p.coins) + '</b><span>سکه</span></div><div class="stat"><b>⭐ ' + U.fa(p.xp) + '</b><span>امتیاز</span></div></div>' + runBtn + '</div>' +
      '<div class="card"><h2>🏅 نشان‌های افتخار</h2><div class="badge-row">' + badges + '</div></div>' +
      '<div class="card"><div class="row center">' +
      '<button class="btn btn-yellow" data-act="chests">🧰 صندوق‌ها' + (chestsLeft ? ' (' + U.fa(chestsLeft) + ')' : '') + '</button>' +
      '<button class="btn btn-blue" data-act="go" data-to="lab">🔬 آزمایشگاه</button>' +
      '<button class="btn btn-pink" data-act="go" data-to="shop">👗 آواتار</button>' +
      '<button class="btn btn-green" data-act="go" data-to="board">🏆 رتبه‌بندی</button>' +
      '<button class="btn btn-ghost" data-act="go" data-to="full">📜 کارنامهٔ کل</button></div></div></div></div>');
  });
  App.act('region', function (el) {
    var id = Number(el.getAttribute('data-id')), p = P();
    if (!unlocked(p, id)) { A.play('wrong'); U.toast('🔒 اول منطقهٔ «' + R[id - 2].name + '» را کامل کن', 'bad'); return; }
    App.go('region/' + id);
  });

  /* صندوق‌های گنج */
  App.act('chests', function () {
    var p = P();
    if (!p.chests.length) { U.alert('هنوز صندوقی نداری. با کامل کردن هر منطقه یک صندوق گنج می‌گیری! 🧰'); return; }
    var html = '<h2>🧰 صندوق‌های گنج</h2><div class="chest-list">' + p.chests.map(function (c, i) {
      return '<button class="chest-btn ' + (c.opened ? 'opened' : 'new') + '" data-act="open-chest" data-i="' + i + '">' + Art.chest(c.opened) + '<div>' + R[c.region - 1].emoji + ' ' + (c.opened ? 'باز شده' : 'ببین چی توشه!') + '</div></button>';
    }).join('') + '</div><div class="modal-actions"><button class="btn btn-ghost" data-close="x">بستن</button></div>';
    U.modal(html, { cls: 'wide' });
  });
  App.act('open-chest', function (el) {
    var p = P(), i = Number(el.getAttribute('data-i')), c = p.chests[i];
    if (!c || c.opened) { U.toast('این صندوق قبلاً باز شده است'); return; }
    U.closeAllModals();
    var m = U.modal('<div class="reward-pop chest-shake" id="cs">' + Art.chest(false) + '<p class="modal-text">در حال باز شدن…</p></div>', { sticky: true });
    A.play('chest');
    setTimeout(function () {
      c.opened = true; c.reward = { coins: U.rand(8, 20), xp: 5 }; var fact = FACTS[U.rand(0, FACTS.length - 1)];
      App.award(c.reward.xp, c.reward.coins); App.save(); m.close();
      App.rewardModal({ emoji: '🎁', title: 'صندوق باز شد!', text: '💡 ' + fact, xp: c.reward.xp, coins: c.reward.coins, onClose: function () { if (S.route === 'map') App.refresh(); } });
    }, 1300);
  });

  /* ═════════════ معرفی منطقه ═════════════ */
  App.reg('region', function (idStr) {
    var id = Number(idStr), p = P(), r = R[id - 1];
    if (!r || !unlocked(p, id)) { return App.go('map'); }
    var pool = Store.questionsForRegion(id), n = Math.min(C.QUESTIONS_PER_REGION, pool.length), rec = p.regions[id];
    var resume = p.run && p.run.region === id;
    var steps = ''; for (var i = 1; i <= C.QUESTIONS_PER_REGION; i++) steps += '<div class="st">' + U.fa(i) + '</div>'; steps += '<div class="st puz" title="معما">🧩</div>';
    var warn = pool.length < C.QUESTIONS_PER_REGION ? '<div class="warn-box">این منطقه فقط ' + U.fa(pool.length) + ' سؤال دارد. معلم می‌تواند از «مدیریت سؤال‌ها» سؤال اضافه کند.</div>' : '';
    var status = rec && rec.done ? '<div class="stats-row"><div class="stat"><b>' + U.fa(rec.best || 0) + '٪</b><span>بهترین نتیجه</span></div><div class="stat"><b>' + Art.badge(id, false).replace('class="badge-svg', 'style="width:46px;height:56px" class="badge-svg') + '</b><span>' + r.badge + '</span></div></div>' : '';
    var btns;

    else btns = '<button class="btn btn-green btn-lg btn-block" data-act="start-region" data-id="' + id + '" data-mode="new">' + (rec && rec.done ? '🔁 تمرین دوباره' : '🚀 شروع مرحله') + '</button>';
    if (rec && rec.done && rec.last) btns += '<button class="btn btn-blue btn-block" data-act="go" data-to="report/' + id + '">📜 مرور مرحله و پاسخ‌های تشریحی</button>';

    App.render(backLink('map', 'نقشه') + '<div class="region-banner">' + Art.region(id) + '<h2>' + r.emoji + ' ' + U.esc(r.name) + '</h2></div>' +
      '<div class="card" style="margin-top:14px"><span class="title-pill">منطقهٔ ' + U.fa(id) + ' · ' + U.esc(r.topic) + '</span><p style="margin-top:10px">' + U.esc(r.story) + '</p>' +
      '<p class="game-goal">' + U.esc(r.goal) + '</p>' + '<div class="steps" aria-label="مراحل">' + steps + '</div>' +
      '<p class="muted" style="text-align:center">هر سؤال ' + U.fa(C.QUESTION_SECONDS) + ' ثانیه زمان دارد، سپس معمای «' + U.esc(r.puzzle.title) + '» در انتظار توست. هیچ جریمه‌ای وجود ندارد؛ فقط یاد می‌گیری و جایزه می‌گیری!</p>' +
      warn + status + '<div class="stack">' + btns + '</div></div>');
  });

  function buildRun(regionId) {
    var p = P(), pool = Store.questionsForRegion(regionId), n = Math.min(C.QUESTIONS_PER_REGION, pool.length);
    var fresh = U.shuffle(pool.filter(function (q) { return !p.rewardedQ[q.id]; })), old = U.shuffle(pool.filter(function (q) { return p.rewardedQ[q.id]; }));
    var pick = fresh.concat(old).slice(0, n);
    return { region: regionId, qids: U.shuffle(pick).map(function (q) { return q.id; }), idx: 0, answers: [], phase: 'quiz', puzzle: null, xp: 0, coins: 0, startedAt: Date.now() };
  }
  App.act('start-region', function (el) {
    var id = Number(el.getAttribute('data-id')), mode = el.getAttribute('data-mode'), p = P();
    function go() {
      if (mode === 'resume' && p.run && p.run.region === id) { App.go(p.run.phase === 'puzzle' ? 'puzzle' : 'quiz'); return; }
      if (!Store.questionsForRegion(id).length) { U.toast('برای این منطقه سؤالی وجود ندارد', 'bad'); return; }
      p.run = buildRun(id); App.save(); A.play('whoosh'); App.go('quiz');
    }
    if (mode === 'new' && p.run) {
      U.confirm('مرحلهٔ نیمه‌کاره‌ای ذخیره شده است. اگر از اول شروع کنی، آن پیشرفت کنار گذاشته می‌شود. ادامه می‌دهی؟', 'از اول شروع کن', 'انصراف', true).then(function (ok) { if (ok) go(); });
    } else go();
  });

  /* ═════════════ آزمون: ۱۵ ثانیه برای هر سؤال ═════════════ */
  var tim = null;
  function stopTimer() { if (tim) { clearInterval(tim); tim = null; } }

  App.reg('quiz', function () {
    var p = P(), run = p.run;
    if (!run || run.phase !== 'quiz') { return App.go(run && run.phase === 'puzzle' ? 'puzzle' : 'map'); }
    var q;
    for (;;) {
      if (run.idx >= run.qids.length) { run.phase = 'puzzle'; App.save(); return App.go('puzzle'); }
      if (run.answers[run.idx]) { run.idx++; continue; }
      q = Store.getQuestion(run.qids[run.idx]);
      if (!q) { run.qids.splice(run.idx, 1); continue; }
      break;
    }
    var r = R[run.region - 1], total = run.qids.length, TOT = C.QUESTION_SECONDS * 1000, CIRC = 213.6;
    var order = C.SHUFFLE_OPTIONS ? U.shuffle([0, 1, 2, 3]) : [0, 1, 2, 3];
    var dots = ''; for (var i = 0; i < total; i++) {
      var a = run.answers[i], cls = a ? (a.state === 'ok' ? 'ok' : (a.state === 'bad' ? 'bad' : 'skip')) : (i === run.idx ? 'now' : '');
      dots += '<div class="st ' + cls + '">' + (a ? (a.state === 'ok' ? '✓' : (a.state === 'bad' ? '✗' : '–')) : U.fa(i + 1)) + '</div>';
    }
    dots += '<div class="st puz">🧩</div>';
    var opts = order.map(function (oi, di) {
      return '<button class="opt" data-act="answer" data-i="' + oi + '"><span class="ol">' + U.LETTERS[di] + '</span><span class="otx">' + U.esc(q.options[oi]) + '</span><span class="mark"></span></button>';
    }).join('');

    App.render('<div class="row between"><button class="back-link" data-act="exit-quiz">→ خروج به نقشه</button><span class="chip">' + r.emoji + ' ' + U.esc(r.name) + '</span></div>' +
      '<div class="quiz-head"><span class="qnum">سؤال ' + U.fa(run.idx + 1) + ' از ' + U.fa(total) + '</span>' +
      '<div class="timer" id="timer" role="timer" aria-label="زمان باقی‌مانده"><svg viewBox="0 0 80 80"><circle class="tr-bg" cx="40" cy="40" r="34"/><circle class="tr-fg" id="tfg" cx="40" cy="40" r="34" stroke-dasharray="' + CIRC + '" stroke-dashoffset="0"/></svg><span id="tsec">' + U.fa(C.QUESTION_SECONDS) + '</span></div></div>' +
      '<div class="time-line"><i id="tline"></i></div><div class="steps">' + dots + '</div>' +
      '<div class="card q-card"><div class="q-meta"><span class="tag">' + U.esc(q.topic) + '</span><span class="tag ' + q.difficulty + '">' + U.DIFF[q.difficulty] + '</span></div>' +
      '<div class="q-text">' + U.esc(q.text) + '</div><div class="options" id="opts">' + opts + '</div><div id="fb" aria-live="polite"></div></div>');

    var answered = false, lastSec = -1, deadline = performance.now() + TOT;
    var tsec = document.getElementById('tsec'), tfg = document.getElementById('tfg'), tline = document.getElementById('tline'), timerEl = document.getElementById('timer');

    function finalize(origIdx, timeout) {
      if (answered) return; answered = true; stopTimer();
      var state = timeout ? 'skip' : (origIdx === q.answer ? 'ok' : 'bad');
      var disp = order.map(function (oi) { return q.options[oi]; });
      var snap = { qid: q.id, text: q.text, topic: q.topic, difficulty: q.difficulty, options: disp, correctDisp: order.indexOf(q.answer),
        chosenDisp: timeout ? -1 : order.indexOf(origIdx), state: state, explanation: q.explanation };
      run.answers[run.idx] = snap;
      var gotXp = 0, gotCoins = 0, repeat = false;
      if (state === 'ok') {
        if (!p.rewardedQ[q.id]) { p.rewardedQ[q.id] = 1; gotXp = C.XP_CORRECT; gotCoins = C.COINS_CORRECT; run.xp += gotXp; run.coins += gotCoins; App.award(gotXp, gotCoins); A.play('coin'); }
        else repeat = true;
      }
      App.save();
      A.play(state === 'ok' ? 'correct' : (state === 'bad' ? 'wrong' : 'timeout'));
      Array.prototype.forEach.call(document.querySelectorAll('#opts .opt'), function (b) {
        var oi = Number(b.getAttribute('data-i')); b.disabled = true; b.removeAttribute('data-act');
        if (oi === q.answer) { b.classList.add('correct'); b.querySelector('.mark').textContent = '✅'; }
        else if (!timeout && oi === origIdx) { b.classList.add('wrong'); b.querySelector('.mark').textContent = '❌'; }
        else b.classList.add('dim');
      });
      var head, cls = state;
      if (state === 'ok') head = '🎉 آفرین! پاسخ درست بود.';
      else if (state === 'bad') head = '😊 این بار نشد، اشکالی ندارد! پاسخ درست: «' + q.options[q.answer] + '»';
      else head = '⏰ زمان تمام شد و این سؤال بدون پاسخ ثبت شد. پاسخ درست: «' + q.options[q.answer] + '»';
      var rew = gotXp ? '<div class="reward-float"><span>⭐ +' + U.fa(gotXp) + ' امتیاز</span><span>🪙 +' + U.fa(gotCoins) + ' سکه</span></div>' : (repeat ? '<div class="muted">امتیاز این سؤال را قبلاً گرفته‌ای.</div>' : '');
      var last = run.idx >= total - 1;
      document.getElementById('fb').innerHTML = '<div class="feedback ' + cls + '"><h3>' + head + '</h3>' + rew + '<p style="margin-top:6px"><b>💡 توضیح علمی:</b> ' + U.esc(q.explanation) + '</p></div>' +
        '<div class="row center" style="margin-top:12px"><button class="btn btn-green btn-lg" id="nextq" data-act="next-q">' + (last ? '🧩 برو به معما' : 'سؤال بعدی ➜') + '</button></div>';
      var nb = document.getElementById('nextq'); if (nb) { try { nb.focus({ preventScroll: false }); } catch (e) { nb.focus(); } }
    }
    App.act('answer', function (el) { if (!answered) finalize(Number(el.getAttribute('data-i')), false); });
    App.act('next-q', function () {
      var rn = P().run; if (!rn) return;
      rn.idx++;
      if (rn.idx >= rn.qids.length) { rn.phase = 'puzzle'; App.save(); A.play('whoosh'); App.go('puzzle'); }
      else { App.save(); App.refresh(); }
    });

    function tick() {
      var rem = deadline - performance.now();
      if (rem <= 0) { tsec.textContent = U.fa(0); tfg.setAttribute('stroke-dashoffset', CIRC); tline.style.transform = 'scaleX(0)'; finalize(null, true); return; }
      var sec = Math.ceil(rem / 1000);
      tfg.setAttribute('stroke-dashoffset', (CIRC * (1 - rem / TOT)).toFixed(2));
      tline.style.transform = 'scaleX(' + (rem / TOT).toFixed(4) + ')';
      if (sec !== lastSec) { lastSec = sec; tsec.textContent = U.fa(sec); timerEl.classList.toggle('warn', sec <= 8 && sec > 5); timerEl.classList.toggle('danger', sec <= 5); if (sec <= 5) A.play('tick'); }
    }
    tick(); stopTimer(); tim = setInterval(tick, 100);

    function onKey(e) {
      if (answered || U.hasModal()) return;
      var m = { '1': 0, '2': 1, '3': 2, '4': 3, '۱': 0, '۲': 1, '۳': 2, '۴': 3 }[e.key];
      if (m == null) return;
      var b = document.querySelectorAll('#opts .opt')[m]; if (b) b.click();
    }
    document.addEventListener('keydown', onKey);
    App.onLeave(function () { stopTimer(); document.removeEventListener('keydown', onKey); });
  });
  App.act('exit-quiz', function () {
    U.confirm('پیشرفتت ذخیره می‌شود و بعداً می‌توانی ادامه بدهی؛ اما سؤال فعلی دوباره از اول شروع می‌شود. خارج می‌شوی؟', 'خروج به نقشه', 'ماندن').then(function (ok) { if (ok) App.go('map'); });
  });

  /* ═════════════ معمای پایان مرحله ═════════════ */
  var puzzleHandle = null;
  App.reg('puzzle', function () {
    var p = P(), run = p.run;
    if (!run || run.phase !== 'puzzle') return App.go(run ? 'quiz' : 'map');
    var r = R[run.region - 1], pz = r.puzzle, hinted = false;
    App.render('<div class="row between"><button class="back-link" data-act="go" data-to="map">→ نقشه (ذخیره می‌شود)</button><span class="chip">' + r.emoji + ' ' + U.esc(r.name) + '</span></div>' +
      '<div class="card game-card"><span class="title-pill">🧩 معمای مرحله: ' + U.esc(pz.title) + '</span><div class="game-story" style="margin-top:10px">📖 ' + U.esc(pz.story) + '</div>' +
      '<div class="game-goal">' + U.esc(pz.goal) + '</div><div class="game-area" id="game"></div>' +
      '<div class="row center" style="margin-top:12px"><button class="btn btn-blue btn-sm" data-act="hint">💡 راهنمایی</button><button class="btn btn-ghost btn-sm hidden" id="skipbtn" data-act="skip-puzzle">⏭️ رد شدن (بدون جایزه)</button></div><div id="hintbox"></div></div>');
    puzzleHandle = G.mount(pz.game, document.getElementById('game'), onWin);

      var s = document.getElementById('skipbtn'); if (s) s.classList.remove('hidden');

    function onWin() {

      var first = !P().puzzleRewarded[rn.region], xp = 0, coins = 0;
      if (first) { P().puzzleRewarded[rn.region] = 1; xp = C.XP_PUZZLE; coins = C.COINS_PUZZLE; rn.xp += xp; rn.coins += coins; App.award(xp, coins); }
      rn.puzzle = 'solved'; App.save();
      App.rewardModal({ emoji: '🧩', title: 'معما حل شد!', text: first ? 'عالی بود! جایزهٔ معما:' : 'قبلاً جایزهٔ این معما را گرفته‌ای، اما حل کردنش دوباره عالی بود!', xp: xp, coins: coins, sticky: true, button: 'برو به کارنامه', onClose: completeRegion });
    }

  App.act('skip-puzzle', function () {

    });
  });

  function completeRegion() {
    var p = P(), run = p.run; if (!run) return App.go('map');
    var r = run.region, ans = run.answers, ok = 0, bad = 0, skip = 0;
    ans.forEach(function (a) { if (a.state === 'ok') ok++; else if (a.state === 'bad') bad++; else skip++; });
    var total = ans.length, pct = total ? Math.round(ok / total * 100) : 0;
    var rec = p.regions[r] || {}, first = !rec.done;
    rec.done = true; rec.best = Math.max(rec.best || 0, pct);
    rec.last = { answers: ans, correct: ok, wrong: bad, skipped: skip, total: total, percent: pct, xp: run.xp, coins: run.coins, puzzle: run.puzzle, at: Date.now() };
    p.regions[r] = rec;
    if (first) {
      if (p.badges.indexOf(r) < 0) p.badges.push(r);
      p.chests.push({ id: Store.uid('c'), region: r, opened: false, reward: null });

  /* ═════════════ کارنامه ═════════════ */
  function ringHtml(pct) {
    return '<div class="pct-ring"><svg viewBox="0 0 140 140"><defs><linearGradient id="pctg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5c9d"/><stop offset="1" stop-color="#ffd23f"/></linearGradient></defs>' +
      '<circle class="bgc" cx="70" cy="70" r="60"/><circle class="fgc" cx="70" cy="70" r="60" stroke-dasharray="377" stroke-dashoffset="377" data-pct="' + pct + '"/></svg><b>' + U.fa(pct) + '٪</b></div>';
  }
  function animateRing() {
    setTimeout(function () {
      Array.prototype.forEach.call(document.querySelectorAll('.fgc'), function (c) { c.setAttribute('stroke-dashoffset', (377 * (1 - Number(c.getAttribute('data-pct')) / 100)).toFixed(1)); });
    }, 120);
  }
  function praise(pct) {
    if (pct >= 90) return ['🌟 فوق‌العاده بود!', 'تو واقعاً انرژی را می‌شناسی.'];
    if (pct >= 70) return ['🎉 عالی بود!', 'خیلی خوب پیش رفتی.'];
    if (pct >= 40) return ['👏 آفرین!', 'با کمی تمرین بیشتر حتماً بهتر هم می‌شوی.'];
    return ['💪 ماجراجویی ادامه دارد!', 'هر اشتباه یک فرصت یادگیری است؛ توضیح‌ها را بخوان و دوباره امتحان کن.'];
  }
  function statGrid(ok, bad, skip, extra) {
    return '<div class="stat-grid"><div class="stat ok"><b>' + U.fa(ok) + '</b><span>پاسخ صحیح</span></div><div class="stat bad"><b>' + U.fa(bad) + '</b><span>پاسخ اشتباه</span></div>' +
      '<div class="stat skip"><b>' + U.fa(skip) + '</b><span>بدون پاسخ</span></div>' + (extra || '') + '</div>';
  }
  function suggestHtml(answers) {
    var map = {};
    answers.forEach(function (a) { if (a.state !== 'ok') map[a.topic] = (map[a.topic] || 0) + 1; });
    var tops = Object.keys(map).sort(function (a, b) { return map[b] - map[a]; });
    if (!tops.length) return '<div class="suggest">✅ همهٔ پاسخ‌ها درست بود؛ فعلاً موضوع خاصی برای تمرین بیشتر لازم نیست. می‌توانی در آزمایشگاه برای سرگرمی آزمایش کنی!</div>';
    return '<div class="suggest"><b>📌 پیشنهاد برای تمرین بیشتر:</b><ul>' + tops.map(function (t) {
      var lab = C.TOPIC_LAB[t];
      return '<li>' + U.esc(t) + ' (' + U.fa(map[t]) + ' سؤال) ' + (lab ? '<button class="btn btn-blue btn-sm" data-act="go" data-to="lab/' + lab + '">🔬 تمرین در آزمایشگاه</button>' : '') + '</li>';
    }).join('') + '</ul></div>';
  }
  function reviewHtml(answers) {
    return answers.map(function (a, i) {
      var chosen = a.chosenDisp >= 0 ? U.LETTERS[a.chosenDisp] + ') ' + a.options[a.chosenDisp] : 'بدون پاسخ';

      return '<div class="review-item ' + a.state + '"><h4>' + icon + ' سؤال ' + U.fa(i + 1) + ': ' + U.esc(a.text) + '</h4>' +
        '<div class="ans">پاسخ تو: <b>' + U.esc(chosen) + '</b></div><div class="ans">پاسخ درست: <b class="pos">' + U.LETTERS[a.correctDisp] + ') ' + U.esc(a.options[a.correctDisp]) + '</b></div>' +
        '<div class="ans" style="margin-top:4px">💡 ' + U.esc(a.explanation) + '</div></div>';
    }).join('');
  }

      '<p class="muted">' + puzTxt + '</p><div class="row center">' + btns + '</div></div></div>' +
