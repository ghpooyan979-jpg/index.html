    else if (L.percent >= 70) A.play('reward');
  });

  /* کارنامهٔ کل / پایانی */
  App.reg('full', function () {
    var p = P(), ok = 0, bad = 0, skip = 0, all = [], regionsDone = [];
    R.forEach(function (r) { var rec = p.regions[r.id]; if (rec && rec.last) { regionsDone.push(r); rec.last.answers.forEach(function (a) { all.push(a); if (a.state === 'ok') ok++; else if (a.state === 'bad') bad++; else skip++; }); } });
    var total = ok + bad + skip, pct = total ? Math.round(ok / total * 100) : 0;
    var finale = p.badges.length === 4, first = finale && !p.finaleSeen;
    var title = finale ? '🏆 تو قهرمان سرزمین انرژی شدی!' : '📜 کارنامهٔ ماجراجویی';
    var li = Store.levelInfo(p.xp);
    var body = !total ? '<p class="modal-text">هنوز منطقه‌ای را تمام نکرده‌ای. اولین مرحله را شروع کن!</p><button class="btn btn-green" data-act="go" data-to="map">🗺️ نقشه</button>' :
      statGrid(ok, bad, skip, '<div class="stat"><b>⭐ ' + U.fa(p.xp) + '</b><span>امتیاز کل</span></div><div class="stat"><b>🪙 ' + U.fa(p.coinsEarned || 0) + '</b><span>سکهٔ دریافت‌شده</span></div><div class="stat"><b>🗺️ ' + U.fa(p.badges.length) + ' از ۴</b><span>منطقهٔ تکمیل‌شده</span></div>');
    App.render(backLink('map', 'نقشه') + '<div class="card report-hero glass"><canvas id="cf"></canvas><div style="position:relative"><div style="width:120px;margin:0 auto">' + avatar(p) + '</div><h2>' + title + '</h2><p><b>' + U.esc(p.name) + '</b> · سطح ' + U.fa(li.level) + ': ' + li.name + '</p>' +
      (finale ? '<p>هر چهار منطقه را گشودی و همهٔ نشان‌ها را گرفتی. دنیای انرژی به لطف تو دوباره روشن شد! 🌟</p>' : '') +
      (total ? ringHtml(pct) : '') + body + '<div class="badge-row">' + R.map(function (r) { return '<div class="bd">' + Art.badge(r.id, !done(p, r.id)) + (done(p, r.id) ? r.badge : '؟') + '</div>'; }).join('') + '</div></div></div>' +
      (total ? '<div class="card" style="margin-top:14px">' + suggestHtml(all) + '</div>' +
        R.map(function (r) { var rec = p.regions[r.id]; if (!rec || !rec.last) return ''; return '<details class="card" style="margin-top:14px"><summary style="font-weight:800;cursor:pointer">' + r.emoji + ' ' + U.esc(r.name) + ' — ' + U.fa(rec.last.percent) + '٪ (پاسخ‌های تشریحی)</summary><div style="margin-top:10px">' + reviewHtml(rec.last.answers) + '</div></details>'; }).join('') : ''));
    animateRing();
    if (first) { p.finaleSeen = true; App.save(); A.play('win'); Art.confetti(document.getElementById('cf'), 6500); }
  });

  /* ───────── اتصال به اکشن «region» داخل کارنامه ───────── */
  App.act('go-region', function (el) { App.go('region/' + el.getAttribute('data-id')); });
})();

</script>
<script>
/* صفحه‌های جانبی: آزمایشگاه، بازی‌های آزاد، فروشگاه آواتار، رتبه‌بندی، پنل معلم */
(function () {
  'use strict';
  var EA = window.EA, U = EA.U, Store = EA.Store, A = EA.Audio, Art = EA.Art, C = EA.CONFIG, App = EA.App, S = App.S, G = EA.Games, Lab = EA.Lab;
  var R = C.REGIONS;
  function backLink(to, label) { return '<button class="back-link" data-act="go" data-to="' + to + '">→ ' + U.esc(label) + '</button>'; }

  /* ═════════════ آزمایشگاه ═════════════ */
  var labStop = null;
  App.reg('lab', function (id) {
    var ex = Lab.EXPERIMENTS.filter(function (e) { return e.id === id; })[0] || Lab.EXPERIMENTS[0];
    App.render(backLink(S.p ? 'map' : 'home', S.p ? 'نقشه' : 'صفحهٔ اصلی') + '<h1 class="page-title">🔬 آزمایشگاه فیزیک</h1>' +
      '<div class="lab-tabs" role="tablist">' + Lab.EXPERIMENTS.map(function (e) {
        return '<button role="tab" aria-selected="' + (e.id === ex.id) + '" data-act="go" data-to="lab/' + e.id + '">' + e.emoji + ' ' + e.name + '</button>';
      }).join('') + '</div><div id="labroot"></div>');
    labStop = Lab.mount(ex.id, document.getElementById('labroot'));
    App.onLeave(function () { if (labStop) { labStop(); labStop = null; } });
  });

  /* ═════════════ بازی‌های آزاد ═════════════ */
  var playHandle = null;
  App.reg('play', function (key) {
    if (!key || !G.META[key]) {
      var cards = Object.keys(G.META).map(function (k) {
        var m = G.META[k], reg = R.filter(function (r) { return r.puzzle.game === k; })[0];
        var got = S.p && S.p.playRewarded[k];
        return '<button class="card" style="text-align:center;cursor:pointer;border-color:#ffd23f" data-act="go" data-to="play/' + k + '"><div style="font-size:3rem">' + m.emoji + '</div><b>' + m.name + '</b><div class="muted">' + (reg ? 'معمای ' + reg.name : 'ویژهٔ تمرین آزاد') + '</div>' + (got ? '<div class="tag easy">حل شده ✓</div>' : '') + '</button>';
      }).join('');
      App.render(backLink(S.p ? 'map' : 'home', S.p ? 'نقشه' : 'صفحهٔ اصلی') + '<h1 class="page-title">🎮 بازی‌های آزاد</h1><p style="color:#fff;font-weight:700">هر بازی را هر چقدر خواستی تمرین کن. ' + (S.p ? 'اولین بار که حلش کنی ' + U.fa(C.COINS_PLAYGROUND) + ' سکه جایزه می‌گیری.' : 'برای گرفتن جایزه اول یک قهرمان بساز.') + '</p>' +
        '<div class="item-grid" style="grid-template-columns:repeat(auto-fill,minmax(210px,1fr))">' + cards + '</div>');
      return;
    }
    var reg = R.filter(function (r) { return r.puzzle.game === key; })[0], st = reg ? reg.puzzle : G.STORY[key];
    App.render(backLink('play', 'بازی‌ها') + '<div class="card game-card"><span class="title-pill">' + G.META[key].emoji + ' ' + G.META[key].name + '</span>' +
      '<div class="game-story" style="margin-top:10px">📖 ' + U.esc(st.story) + '</div><div class="game-goal">' + U.esc(st.goal) + '</div><div class="game-area" id="game"></div>' +
      '<div class="row center" style="margin-top:12px"><button class="btn btn-blue btn-sm" data-act="play-hint">💡 راهنمایی</button></div><div id="hintbox"></div></div>');
    function win() {
      var coins = 0;
      if (S.p && !S.p.playRewarded[key]) { S.p.playRewarded[key] = 1; coins = C.COINS_PLAYGROUND; App.award(0, coins); App.save(); }
      App.rewardModal({ emoji: '🏆', title: 'عالی حلش کردی!', text: coins ? 'اولین حل این بازی، جایزه دارد:' : (S.p ? 'جایزهٔ این بازی را قبلاً گرفته‌ای.' : 'برای گرفتن جایزه یک قهرمان بساز.'), coins: coins, button: '🔁 بازی دوباره', onClose: function () { App.refresh(); } });
    }
    playHandle = G.mount(key, document.getElementById('game'), win);
    App.onLeave(function () { if (playHandle) { playHandle.destroy(); playHandle = null; } });
    App.act('play-hint', function () { document.getElementById('hintbox').innerHTML = '<div class="hint-box">💡 ' + U.esc(st.hint) + '</div>'; });
  });

  /* ═════════════ آواتار و فروشگاه ═════════════ */
  App.reg('shop', function () {
    var p = S.p, li = Store.levelInfo(p.xp);
    var slots = Object.keys(C.SLOTS).map(function (slot) {
      var items = C.ITEMS.filter(function (i) { return i.slot === slot; });
      return '<div class="slot-title">' + C.SLOTS[slot] + '</div><div class="item-grid">' + items.map(function (it) {
        var owned = p.owned.indexOf(it.id) >= 0, on = p.equipped[slot] === it.id, lock = li.level < it.minLevel;
        var btn = owned ? '<button class="btn btn-sm ' + (on ? 'btn-ghost' : 'btn-green') + '" data-act="equip" data-id="' + it.id + '">' + (on ? 'درآوردن' : 'بپوش') + '</button>' :
          (lock ? '<button class="btn btn-sm" disabled>🔒 سطح ' + U.fa(it.minLevel) + '</button>' : '<button class="btn btn-sm btn-yellow" data-act="buy" data-id="' + it.id + '"' + (p.coins < it.price ? ' disabled' : '') + '>🪙 ' + U.fa(it.price) + ' بخر</button>');
        return '<div class="item ' + (on ? 'on' : '') + (lock && !owned ? ' lock' : '') + '">' + Art.itemPreview(p.character, it) + '<div class="iname">' + it.name + '</div>' +
          (lock && !owned ? '<div class="lv">با رسیدن به «' + C.LEVELS[it.minLevel - 1].name + '» باز می‌شود</div>' : '') + btn + '</div>';
      }).join('') + '</div>';
    }).join('');
    var chars = C.CHARACTERS.map(function (c) {
      return '<button class="char-btn" data-act="set-char" data-id="' + c.id + '" aria-pressed="' + (c.id === p.character) + '">' + Art.avatar(c.id, p.equipped) + c.name + '</button>';
    }).join('');
    App.render(backLink('map', 'نقشه') + '<h1 class="page-title">👗 آواتار و فروشگاه</h1><div class="shop-head card purple"><div class="preview-box">' + Art.avatar(p.character, p.equipped) + '<b>' + U.esc(p.name) + '</b></div>' +
      '<div><div class="stats-row"><div class="stat"><b>🪙 ' + U.fa(p.coins) + '</b><span>سکه</span></div><div class="stat"><b>سطح ' + U.fa(li.level) + '</b><span>' + li.name + '</span></div></div>' +
      '<p class="muted">آیتم‌ها فقط با سکهٔ بازی خریده می‌شوند؛ هیچ پرداخت واقعی در کار نیست. با بالا رفتن سطح، آیتم‌های بیشتری باز می‌شود.</p></div></div>' +
      '<div class="card" style="margin-top:14px"><h2>🧙 تغییر شخصیت</h2><div class="char-grid">' + chars + '</div>' + slots + '</div>');
  });
  App.act('set-char', function (el) { S.p.character = el.getAttribute('data-id'); App.save(); App.refresh(); });
  App.act('equip', function (el) {
    var id = el.getAttribute('data-id'), it = C.ITEMS.filter(function (i) { return i.id === id; })[0]; if (!it) return;
    S.p.equipped[it.slot] = S.p.equipped[it.slot] === id ? null : id; App.save(); App.refresh();
  });
  App.act('buy', function (el) {
    var id = el.getAttribute('data-id'), it = C.ITEMS.filter(function (i) { return i.id === id; })[0], p = S.p;
    if (!it || p.owned.indexOf(id) >= 0) return;
    if (Store.levelInfo(p.xp).level < it.minLevel) { U.toast('هنوز به سطح لازم نرسیده‌ای', 'bad'); return; }
    if (p.coins < it.price) { A.play('wrong'); U.toast('سکهٔ کافی نداری؛ با حل سؤال‌ها سکه جمع کن', 'bad'); return; }
    p.coins -= it.price; p.owned.push(id); p.equipped[it.slot] = id; App.save(); A.play('reward'); U.toast('🎉 «' + it.name + '» خریداری شد!', 'good'); App.refresh();
  });

  /* ═════════════ جدول رتبه‌بندی ═════════════ */
  App.reg('board', function () {
    App.render(backLink(S.p ? 'map' : 'home', S.p ? 'نقشه' : 'صفحهٔ اصلی') + '<h1 class="page-title">🏆 جدول رتبه‌بندی</h1><div class="card" id="lbbox"></div>');
    var box = document.getElementById('lbbox');
    function draw(rows, note) {
      rows.sort(function (a, b) { return b.xp - a.xp || b.regions - a.regions || a.name.localeCompare(b.name, 'fa'); });
      if (!rows.length) { box.innerHTML = '<p class="modal-text">هنوز کسی در جدول نیست. اولین قهرمان باش!</p>' + note; return; }
      var medals = ['🥇', '🥈', '🥉'];
      box.innerHTML = note + '<table class="lb-table"><thead><tr><th></th><th>نام</th><th>امتیاز</th><th class="lb-hide">مناطق</th><th>نشان‌ها</th></tr></thead><tbody>' + rows.map(function (r, i) {
        return '<tr class="' + (S.p && r.id === S.p.id ? 'me' : '') + '"><td class="lb-rank">' + (medals[i] || U.fa(i + 1)) + '</td><td><div class="lb-name">' + Art.avatar(r.character, r.equipped || {}) + '<span>' + U.esc(r.name) + '</span></div></td>' +
          '<td>⭐ ' + U.fa(r.xp) + '</td><td class="lb-hide">' + U.fa(r.regions) + ' از ۴</td><td><div class="mini-badges">' + [1, 2, 3, 4].map(function (k) { return Art.badge(k, (r.badges || []).indexOf(k) < 0); }).join('') + '</div></td></tr>';
      }).join('') + '</tbody></table>';
    }
    var local = Store.profileList().map(function (p) { return { id: p.id, name: p.name, character: p.character, equipped: p.equipped, xp: p.xp, regions: p.badges.length, badges: p.badges }; });
    var note = '<p class="muted">📍 این جدول فقط قهرمان‌های ذخیره‌شده روی <b>همین دستگاه و مرورگر</b> را نشان می‌دهد. برای رتبه‌بندی بین دستگاه‌های مختلف به سرور نیاز است (راهنمای README).</p>';
    draw(local, note);
    if (App.remote.on()) {
      App.remote.board().then(function (list) {
        var rows = (Array.isArray(list) ? list : list.scores || []).map(function (r) { return { id: r.id, name: String(r.name || '?'), character: r.character || 'wizard', equipped: r.equipped || {}, xp: Number(r.xp) || 0, regions: Number(r.regions) || 0, badges: r.badges || [] }; });
        draw(rows, '<p class="muted">🌐 رتبه‌بندی آنلاین از سرور مدرسه</p>');
      }).catch(function () { draw(local, '<div class="warn-box">اتصال به سرور برقرار نشد؛ فقط رتبه‌بندی همین دستگاه نمایش داده می‌شود.</div>' + note); });
    }
  });

  /* ═════════════ پنل معلم ═════════════ */
  var filt = { region: '', topic: '', diff: '', src: '', q: '' };
  App.reg('teacher', function () {
    if (Store.hasPassword() && !S.teacherOk) {
      App.render(backLink(S.p ? 'map' : 'home', 'بازگشت') + '<div class="card" style="max-width:420px;margin:20px auto"><h2>🔐 ورود معلم</h2><p class="muted">برای مدیریت سؤال‌ها رمز را وارد کنید.</p>' +
        '<label class="field"><span>رمز</span><input class="input" type="password" id="tpw" autocomplete="off"></label><div id="tpe"></div><button class="btn btn-green btn-block" data-act="t-login">ورود</button></div>');
      var inp = document.getElementById('tpw'); inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') document.querySelector('[data-act="t-login"]').click(); });
      return;
    }
    drawTeacher();
  });
  App.act('t-login', function () {
    var v = document.getElementById('tpw').value;
    if (Store.checkPassword(v)) { S.teacherOk = true; App.refresh(); }
    else { A.play('wrong'); document.getElementById('tpe').innerHTML = '<div class="err-list">رمز درست نیست.</div>'; }
  });

  function regionCounts() {
    return R.map(function (r) { var n = Store.questionsForRegion(r.id).length; return '<span class="chip-btn tag ' + (n < C.QUESTIONS_PER_REGION ? 'hard' : 'easy') + '">' + r.emoji + ' ' + U.fa(n) + ' سؤال' + (n < C.QUESTIONS_PER_REGION ? ' (کمتر از ۵!)' : '') + '</span>'; }).join(' ');
  }
  function drawTeacher() {
    var topics = Store.topicsInUse();
    App.render(backLink(S.p ? 'map' : 'home', 'بازگشت') + '<h1 class="page-title">📝 مدیریت سؤال‌ها (پنل معلم)</h1>' +
      '<div class="card"><div class="muted" style="margin-bottom:6px">تعداد سؤال هر منطقه (برای اجرای کامل مرحله حداقل ۵ سؤال لازم است):</div><div>' + regionCounts() + '</div>' +
      '<div class="t-toolbar"><button class="btn btn-green" data-act="t-new">➕ سؤال جدید</button><button class="btn btn-blue btn-sm" data-act="t-export">⬇️ خروجی JSON</button><button class="btn btn-yellow btn-sm" data-act="t-import">⬆️ ورود از JSON</button>' +
      '<button class="btn btn-ghost btn-sm" data-act="t-export-js">📄 دانلود questions.js</button><button class="btn btn-ghost btn-sm" data-act="t-reset">↩️ بازگرداندن سؤال‌های اصلی</button><button class="btn btn-ghost btn-sm" data-act="t-pw">🔐 رمز پنل</button></div>' +
      '<div class="t-filters"><select class="input" id="f-region"><option value="">همهٔ مناطق</option>' + R.map(function (r) { return '<option value="' + r.id + '"' + (String(filt.region) === String(r.id) ? ' selected' : '') + '>' + r.emoji + ' ' + r.name + '</option>'; }).join('') + '</select>' +
      '<select class="input" id="f-topic"><option value="">همهٔ موضوع‌ها</option>' + topics.map(function (t) { return '<option' + (filt.topic === t ? ' selected' : '') + '>' + U.esc(t) + '</option>'; }).join('') + '</select>' +
      '<select class="input" id="f-diff"><option value="">همهٔ سطح‌ها</option>' + ['easy', 'medium', 'hard'].map(function (d) { return '<option value="' + d + '"' + (filt.diff === d ? ' selected' : '') + '>' + U.DIFF[d] + '</option>'; }).join('') + '</select>' +
      '<select class="input" id="f-src"><option value="">همهٔ منبع‌ها</option><option value="base"' + (filt.src === 'base' ? ' selected' : '') + '>سؤال‌های اصلی</option><option value="teacher"' + (filt.src === 'teacher' ? ' selected' : '') + '>افزودهٔ معلم</option></select>' +
      '<input class="input" id="f-q" placeholder="جستجو در متن سؤال…" value="' + U.esc(filt.q) + '"></div><div id="qlist"></div></div>');
    ['f-region', 'f-topic', 'f-diff', 'f-src'].forEach(function (id) { document.getElementById(id).addEventListener('change', function () { filt[{ 'f-region': 'region', 'f-topic': 'topic', 'f-diff': 'diff', 'f-src': 'src' }[id]] = this.value; drawList(); }); });
    document.getElementById('f-q').addEventListener('input', function () { filt.q = this.value; drawList(); });
    drawList();
  }
  function drawList() {
    var list = Store.allQuestions().filter(function (q) {
      return (!filt.region || String(q.region) === String(filt.region)) && (!filt.topic || q.topic === filt.topic) && (!filt.diff || q.difficulty === filt.diff) &&
        (!filt.src || q.source === filt.src) && (!filt.q || q.text.indexOf(filt.q.trim()) >= 0);
    });
    var box = document.getElementById('qlist');
    if (!list.length) { box.innerHTML = '<p class="modal-text">سؤالی با این فیلترها پیدا نشد.</p>'; return; }
    box.innerHTML = '<p class="muted">' + U.fa(list.length) + ' سؤال</p>' + list.map(function (q) {
      return '<div class="q-row"><div class="qm"><span class="tag">' + R[q.region - 1].emoji + ' ' + U.esc(R[q.region - 1].name) + '</span><span class="tag">' + U.esc(q.topic) + '</span><span class="tag ' + q.difficulty + '">' + U.DIFF[q.difficulty] + '</span>' +
        (q.source === 'teacher' ? '<span class="tag src-teacher">افزودهٔ معلم</span>' : (q.edited ? '<span class="tag medium">ویرایش‌شده</span>' : '')) + '</div>' +
        '<div class="qt">' + U.esc(q.text) + '</div><ul class="oplist">' + q.options.map(function (o, i) { return '<li class="' + (i === q.answer ? 'right' : '') + '">' + U.LETTERS[i] + ') ' + U.esc(o) + (i === q.answer ? ' ✔' : '') + '</li>'; }).join('') + '</ul>' +
        '<div class="muted">💡 ' + U.esc(q.explanation) + '</div><div class="acts"><button class="btn btn-blue btn-sm" data-act="t-edit" data-id="' + q.id + '">✏️ ویرایش</button><button class="btn btn-red btn-sm" data-act="t-del" data-id="' + q.id + '">🗑️ حذف</button>' +
        (q.edited ? '<button class="btn btn-ghost btn-sm" data-act="t-revert" data-id="' + q.id + '">↩️ نسخهٔ اصلی</button>' : '') + '</div></div>';
    }).join('');
  }

  function editor(q) {
    var isNew = !q;
    q = q || { region: Number(filt.region) || 1, topic: '', difficulty: 'medium', text: '', options: ['', '', '', ''], answer: 0, explanation: '' };
    var topics = Store.topicsInUse();
    var m = U.modal('<h2>' + (isNew ? '➕ سؤال جدید' : '✏️ ویرایش سؤال') + '</h2><div id="ee"></div>' +
      '<div class="t-filters"><label class="field"><span>منطقه</span><select class="input" id="e-region">' + R.map(function (r) { return '<option value="' + r.id + '"' + (q.region === r.id ? ' selected' : '') + '>' + r.emoji + ' ' + r.name + '</option>'; }).join('') + '</select></label>' +
      '<label class="field"><span>فصل / موضوع</span><input class="input" id="e-topic" list="e-topics" value="' + U.esc(q.topic) + '" maxlength="40"><datalist id="e-topics">' + topics.map(function (t) { return '<option value="' + U.esc(t) + '">'; }).join('') + '</datalist></label>' +
      '<label class="field"><span>سطح دشواری</span><select class="input" id="e-diff">' + ['easy', 'medium', 'hard'].map(function (d) { return '<option value="' + d + '"' + (q.difficulty === d ? ' selected' : '') + '>' + U.DIFF[d] + '</option>'; }).join('') + '</select></label></div>' +
      '<label class="field"><span>متن سؤال</span><textarea class="input" id="e-text" maxlength="400">' + U.esc(q.text) + '</textarea></label>' +
      '<div class="field"><span>گزینه‌ها (گزینهٔ درست را با دکمهٔ رادیویی مشخص کنید)</span><div class="radio-answers">' + [0, 1, 2, 3].map(function (i) {
        return '<div class="ra"><input type="radio" name="e-ans" value="' + i + '" id="e-r' + i + '"' + (q.answer === i ? ' checked' : '') + ' aria-label="گزینهٔ درست: ' + U.LETTERS[i] + '"><span class="ol">' + U.LETTERS[i] + '</span><input class="input" id="e-o' + i + '" value="' + U.esc(q.options[i] || '') + '" maxlength="160"></div>';
      }).join('') + '</div></div>' +
      '<label class="field"><span>توضیح پاسخ (نمایش داده می‌شود)</span><textarea class="input" id="e-exp" maxlength="500">' + U.esc(q.explanation) + '</textarea></label>' +
      '<div class="modal-actions"><button class="btn btn-green" id="e-save">💾 ذخیره</button><button class="btn btn-ghost" data-close="x">انصراف</button></div>', { cls: 'wide', sticky: true });
    m.el.querySelector('#e-save').addEventListener('click', function () {
      var ans = m.el.querySelector('input[name="e-ans"]:checked');
      var nq = { id: isNew ? Store.newQuestionId() : q.id, region: Number(m.el.querySelector('#e-region').value), topic: m.el.querySelector('#e-topic').value, difficulty: m.el.querySelector('#e-diff').value,
        text: m.el.querySelector('#e-text').value, options: [0, 1, 2, 3].map(function (i) { return m.el.querySelector('#e-o' + i).value; }), answer: ans ? Number(ans.value) : -1, explanation: m.el.querySelector('#e-exp').value };
      var errs = Store.validateQuestion(nq);
      if (errs.length) { m.el.querySelector('#ee').innerHTML = '<div class="err-list"><ul>' + errs.map(function (e) { return '<li>' + U.esc(e) + '</li>'; }).join('') + '</ul></div>'; m.el.scrollTop = 0; A.play('wrong'); return; }
      Store.saveQuestion(nq, isNew ? 'teacher' : q.source);
      m.close(); A.play('coin'); U.toast(isNew ? '✅ سؤال جدید ذخیره شد' : '✅ تغییرات ذخیره شد', 'good'); drawTeacher();
    });
  }
  App.act('t-new', function () { editor(null); });
  App.act('t-edit', function (el) { var q = Store.getQuestion(el.getAttribute('data-id')); if (q) editor(q); });
  App.act('t-del', function (el) {
    var q = Store.getQuestion(el.getAttribute('data-id')); if (!q) return;
    U.confirm('این سؤال حذف شود؟\n«' + q.text + '»', 'حذف شود', 'انصراف', true).then(function (ok) { if (!ok) return; Store.deleteQuestion(q.id); U.toast('سؤال حذف شد'); drawTeacher(); });
  });
  App.act('t-revert', function (el) { Store.revertQuestion(el.getAttribute('data-id')); U.toast('نسخهٔ اصلی بازگردانده شد'); drawTeacher(); });
  App.act('t-reset', function () {
    U.confirm('همهٔ ویرایش‌ها و حذف‌های «سؤال‌های اصلی» لغو می‌شود. (سؤال‌هایی که خودتان اضافه کرده‌اید حفظ می‌شوند.)', 'بازگردانی', 'انصراف', true).then(function (ok) { if (!ok) return; Store.resetBaseEdits(); U.toast('سؤال‌های اصلی بازگردانده شد'); drawTeacher(); });
  });
  App.act('t-export', function () {
    U.download('energy-adventure-questions-' + App.stamp() + '.json', JSON.stringify(Store.exportBank(), null, 2)); U.toast('فایل بانک سؤال دانلود شد ✅', 'good');
  });
  App.act('t-export-js', function () {
    U.download('questions.js', Store.bankAsJs(), 'text/javascript');
    U.alert('فایل questions.js ساخته شد. برای دائمی شدن، آن را در پوشهٔ پروژه جای فایل js/questions.js بگذارید (و اگر از نسخهٔ تک‌فایلی استفاده می‌کنید، دوباره build بگیرید).');
  });
  App.act('t-import', function () {
    U.pickFile('.json,application/json').then(function (f) {
      if (!f) return; var obj; try { obj = JSON.parse(f.text); } catch (e) { U.alert('این فایل JSON معتبر نیست.'); return; }
      if (obj && obj.format === 'energy-adventure-backup') { U.alert('این فایل «پشتیبان کامل» است. آن را از «تنظیمات ← بازیابی از فایل» وارد کنید.'); return; }
      var r = Store.importBank(obj);
      var msg = '✅ ' + U.fa(r.added) + ' سؤال جدید، ' + U.fa(r.updated) + ' به‌روزرسانی، ' + U.fa(r.skipped) + ' ردشده.';
      if (r.errors.length) msg += '\n' + r.errors.slice(0, 5).join('\n');
      U.alert(msg).then(drawTeacher);
    });
  });
  App.act('t-pw', function () {
    var has = Store.hasPassword();
    var m = U.modal('<h2>🔐 رمز پنل معلم</h2><p class="muted">این رمز فقط مانع ورود ساده و تصادفی دانش‌آموزان می‌شود و امنیت واقعی نیست (اطلاعات روی همین مرورگر است).</p>' +
      '<label class="field"><span>رمز جدید' + (has ? ' (خالی = حذف رمز)' : '') + '</span><input class="input" type="password" id="pw1" autocomplete="off"></label>' +
      '<div class="modal-actions"><button class="btn btn-green" id="pw-ok">ذخیره</button><button class="btn btn-ghost" data-close="x">انصراف</button></div>');
    m.el.querySelector('#pw-ok').addEventListener('click', function () {
      var v = m.el.querySelector('#pw1').value; Store.setPassword(v); S.teacherOk = true; m.close(); U.toast(v ? 'رمز تنظیم شد 🔐' : 'رمز حذف شد', 'good');
    });
  });
})();

</script>
<script>
/* نقطهٔ شروع */
(function () {
  'use strict';
  window.addEventListener('error', function (e) { if (window.console) console.error('خطا:', e.message); });
  function start() { window.EA.App.boot(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>
